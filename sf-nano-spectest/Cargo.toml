[package]
name = "sf-nano-spectest"
version = "0.1.0"
edition = "2021"
authors = ["Bill Ming <mbbill@gmail.com>"]
description = "WebAssembly specification test runner for sf-nano"
license = "MIT/Apache-2.0"

[[bin]]
name = "sf-nano-spectest"
path = "src/main.rs"

[features]
# The same WAST runner supports either engine independently or both together.
default = ["jit", "interp"]
jit = ["sf-nano-core/jit", "sf-nano-core/guard-pages"]
interp = ["sf-nano-core/interp"]
# CI-only core variants such as thumb2-test are selected directly with
# `sf-nano-core/<feature>` rather than duplicated as pass-through features.

[dependencies]
sf-nano-core = { path = "../sf-nano-core", default-features = false, features = [
    "validator",
] }
log = { version = "0.4", features = ["release_max_level_debug"] }
env_logger = "0.9"
structopt = "0.3"
wast = "246.0.2"
wat = "1.246.2"
