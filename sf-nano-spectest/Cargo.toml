[package]
name = "sf-nano-spectest"
version = "0.1.0"
edition = "2021"
authors = ["Bill Ming <mbbill@gmail.com>"]
description = "WebAssembly specification test runner for sf-nano"
license = "MIT/Apache-2.0"

[[bin]]
name = "sf-nano-spectest"
path = "src/main.rs"

[features]
# The wast runner drives the JIT's entity model directly, so it is gated on
# `jit`; `interp` brings the separate `--interp` suite. Either feature alone
# is a valid build -- interp-only offers `--interp` and nothing else.
default = ["jit", "interp"]
jit = ["sf-nano-core/jit", "sf-nano-core/guard-pages"]
interp = ["sf-nano-core/interp"]
thumb2-test = ["sf-nano-core/thumb2-test"]

[dependencies]
sf-nano-core = { path = "../sf-nano-core", default-features = false, features = [
    "validator",
] }
log = { version = "0.4", features = ["release_max_level_debug"] }
env_logger = "0.9"
structopt = "0.3"
wast = "246.0.2"
wat = "1.246.2"
