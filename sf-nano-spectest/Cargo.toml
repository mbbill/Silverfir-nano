[package]
name = "sf-nano-spectest"
version = "0.1.0"
edition = "2021"
authors = ["Bill Ming <mbbill@gmail.com>"]
description = "WebAssembly specification test runner for sf-nano"
license = "MIT/Apache-2.0"

[[bin]]
name = "sf-nano-spectest"
path = "src/main.rs"

[features]
default = ["interp"]
jit = ["sf-nano-core/jit"]
interp = ["sf-nano-core/interp"]
backend-emu64 = ["sf-nano-core/backend-emu64"]
backend-emu32 = ["sf-nano-core/backend-emu32"]
thumb2-test = ["sf-nano-core/thumb2-test"]

[dependencies]
sf-nano-core = { path = "../sf-nano-core", features = ["validator"] }
log = { version = "0.4", features = ["release_max_level_debug"] }
env_logger = "0.9"
structopt = "0.3"
wast = "246.0.2"
wat = "1.246.2"
