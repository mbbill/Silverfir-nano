# Suppressions that cannot state their reason inline.
#
# The normal way to record an exception to the repository-wide ban on
# dead-code/unused lint suppression is an inline `reason = "..."` on the
# attribute itself, where the next person to read the code will see it. This
# file is only for sites that cannot carry one -- generated sources, or an
# attribute position the toolchain will not accept a reason on.
#
# It is deliberately empty. Adding an entry means claiming no inline reason is
# possible; say why in a comment above the entry if you add one.
#
# Neither mechanism is a way for an agent to quiet a warning. An agent never
# writes a `reason` or an entry here on its own judgment -- see CLAUDE.md.
version = 1
