<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Silverfir Benchmark History</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fa;
        --panel: #ffffff;
        --text: #1f2328;
        --muted: #57606a;
        --border: #d0d7de;
        --border-soft: #eaeef2;
        --accent: #0969da;
        --better-soft: #dafbe1;
        --better-strong: #8ddb8c;
        --worse-soft: #ffebe9;
        --worse-strong: #ffaba8;
        --missing: #f6f8fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
      }

      a {
        color: var(--accent);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .app {
        max-width: 1600px;
        margin: 0 auto;
        padding: 14px;
      }

      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 22px;
        line-height: 1.2;
      }

      .subhead {
        margin: 0;
        color: var(--muted);
      }

      .meta {
        color: var(--muted);
        font-size: 12px;
        text-align: right;
        white-space: nowrap;
      }

      .controls {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 8px 0 10px;
        margin-bottom: 8px;
        background: var(--bg);
        border-bottom: 1px solid var(--border-soft);
      }

      .platform-button {
        height: 30px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .platform-button[aria-pressed="true"] {
        border-color: var(--accent);
        background: #ddf4ff;
        color: #0550ae;
        font-weight: 600;
      }

      .legend {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-left: auto;
        color: var(--muted);
        font-size: 12px;
      }

      .swatch {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .swatch::before {
        content: "";
        width: 18px;
        height: 12px;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--panel);
      }

      .swatch.better-soft::before {
        background: var(--better-soft);
      }

      .swatch.better-strong::before {
        background: var(--better-strong);
      }

      .swatch.worse-soft::before {
        background: var(--worse-soft);
      }

      .swatch.worse-strong::before {
        background: var(--worse-strong);
      }

      .platform {
        margin-bottom: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: var(--panel);
      }

      .platform[hidden] {
        display: none;
      }

      .platform-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        background: #ffffff;
      }

      .platform-title {
        margin: 0;
        font-size: 16px;
        line-height: 1.2;
      }

      .platform-summary {
        color: var(--muted);
        font-size: 12px;
      }

      .table-wrap {
        width: 100%;
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 980px;
        border-collapse: separate;
        border-spacing: 0;
        table-layout: fixed;
        font-variant-numeric: tabular-nums;
      }

      th,
      td {
        border-right: 1px solid var(--border-soft);
        border-bottom: 1px solid var(--border-soft);
        padding: 5px 7px;
      }

      th:last-child,
      td:last-child {
        border-right: 0;
      }

      thead th {
        position: sticky;
        top: 49px;
        z-index: 4;
        background: #f6f8fa;
        color: var(--muted);
        text-align: right;
        font-size: 11px;
        font-weight: 600;
      }

      th.benchmark-head,
      td.benchmark-name {
        position: sticky;
        left: 0;
        z-index: 5;
        width: 220px;
        min-width: 220px;
        max-width: 220px;
        text-align: left;
        background: var(--panel);
      }

      th.benchmark-head {
        z-index: 6;
        background: #f6f8fa;
      }

      .commit-link {
        display: block;
        color: var(--text);
        font-weight: 700;
      }

      .commit-date {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 400;
      }

      .group-row td {
        position: sticky;
        left: 0;
        z-index: 3;
        background: #f6f8fa;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }

      .benchmark-name {
        font-weight: 600;
      }

      .unit {
        display: block;
        margin-top: 2px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 400;
      }

      .metric {
        text-align: right;
        background: #ffffff;
      }

      .metric.neutral {
        background: #ffffff;
      }

      .metric.better-soft {
        background: var(--better-soft);
      }

      .metric.better-strong {
        background: var(--better-strong);
      }

      .metric.worse-soft {
        background: var(--worse-soft);
      }

      .metric.worse-strong {
        background: var(--worse-strong);
      }

      .metric.missing {
        background: var(--missing);
        color: var(--muted);
      }

      .value {
        display: block;
        font-weight: 650;
      }

      .delta {
        display: block;
        margin-top: 1px;
        color: var(--muted);
        font-size: 10px;
      }

      .empty {
        padding: 24px;
        border: 1px dashed var(--border);
        border-radius: 8px;
        background: var(--panel);
        color: var(--muted);
      }

      @media (max-width: 760px) {
        .app {
          padding: 10px;
        }

        .topbar,
        .platform-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .meta {
          text-align: left;
          white-space: normal;
        }

        .legend {
          width: 100%;
          margin-left: 0;
        }

        thead th {
          top: 86px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <h1>Silverfir Benchmark History</h1>
          <p class="subhead">Per-platform benchmark tables over the latest 10 commits.</p>
        </div>
        <div class="meta">
          <div>Last update: <span id="last-update">loading...</span></div>
          <div><a id="repository-link" rel="noopener">repository</a></div>
        </div>
      </header>

      <nav class="controls" aria-label="Platform selector">
        <div id="platform-buttons"></div>
        <div class="legend" aria-label="Delta legend">
          <span class="swatch">within 1%</span>
          <span class="swatch better-soft">+1% to +5%</span>
          <span class="swatch better-strong">&gt; +5%</span>
          <span class="swatch worse-soft">-1% to -5%</span>
          <span class="swatch worse-strong">&lt; -5%</span>
        </div>
      </nav>

      <main id="platforms"></main>
    </div>

    <script src="data.js"></script>
    <script>
      "use strict";

      const PLATFORM_ORDER = [
        "x64-linux",
        "arm64-linux",
        "arm64-darwin",
        "x64-windows",
        "armv7-a",
        "riscv64",
        "riscv32"
      ];

      const BENCH_GROUPS = [
        {
          name: "Integer / Control Flow",
          benches: ["coremark", "sha256", "bzip2", "lz4-compress", "lz4-decompress"]
        },
        {
          name: "Lua",
          benches: ["lua-sunfish", "lua-json"]
        },
        {
          name: "Floating Point",
          benches: ["mandelbrot", "c-ray"]
        },
        {
          name: "Memory Bound",
          benches: ["stream-Copy", "stream-Scale", "stream-Add", "stream-Triad"]
        },
        {
          name: "Database",
          benches: ["sqlite-total"]
        }
      ];

      const BENCH_LABELS = {
        "coremark": "CoreMark",
        "sha256": "SHA-256",
        "bzip2": "bzip2",
        "lz4-compress": "LZ4 compress",
        "lz4-decompress": "LZ4 decompress",
        "lua-sunfish": "Lua sunfish",
        "lua-json": "Lua JSON",
        "mandelbrot": "Mandelbrot",
        "c-ray": "c-ray",
        "stream-Copy": "STREAM Copy",
        "stream-Scale": "STREAM Scale",
        "stream-Add": "STREAM Add",
        "stream-Triad": "STREAM Triad",
        "sqlite-total": "SQLite total"
      };

      function parseEntryName(name) {
        const match = /^(.*) \((higher|lower) is better\)$/.exec(name);
        if (!match) {
          return null;
        }
        return {
          platform: match[1],
          direction: match[2]
        };
      }

      function directionForEntry(entry, parsed) {
        if (entry.tool === "customSmallerIsBetter" || parsed.direction === "lower") {
          return "lower";
        }
        return "higher";
      }

      function buildPlatforms(data) {
        const platforms = new Map();
        const entries = data.entries || {};

        for (const [entryName, history] of Object.entries(entries)) {
          const parsed = parseEntryName(entryName);
          if (!parsed) {
            continue;
          }

          if (!platforms.has(parsed.platform)) {
            platforms.set(parsed.platform, {
              name: parsed.platform,
              commits: new Map(),
              benches: new Map()
            });
          }

          const platform = platforms.get(parsed.platform);
          for (const entry of history || []) {
            const commit = entry.commit || {};
            const id = commit.id || String(entry.date || "");
            const date = Number(entry.date || Date.parse(commit.timestamp || 0) || 0);
            const direction = directionForEntry(entry, parsed);

            if (!platform.commits.has(id)) {
              platform.commits.set(id, {
                id,
                shortId: id.slice(0, 7),
                message: commit.message || "",
                timestamp: commit.timestamp || "",
                url: commit.url || "",
                date,
                benches: new Map()
              });
            }

            const commitEntry = platform.commits.get(id);
            commitEntry.date = Math.max(commitEntry.date, date);
            if (!commitEntry.timestamp && commit.timestamp) {
              commitEntry.timestamp = commit.timestamp;
            }
            if (!commitEntry.url && commit.url) {
              commitEntry.url = commit.url;
            }
            if (!commitEntry.message && commit.message) {
              commitEntry.message = commit.message;
            }

            for (const bench of entry.benches || []) {
              const value = Number(bench.value);
              if (!Number.isFinite(value)) {
                continue;
              }

              const metric = {
                name: bench.name,
                value,
                unit: bench.unit || "",
                direction
              };
              commitEntry.benches.set(bench.name, metric);
              platform.benches.set(bench.name, {
                name: bench.name,
                unit: bench.unit || "",
                direction
              });
            }
          }
        }

        return Array.from(platforms.values())
          .map(platform => ({
            ...platform,
            commits: Array.from(platform.commits.values())
              .sort((a, b) => b.date - a.date)
              .slice(0, 10)
              .reverse()
          }))
          .sort((a, b) => {
            const ai = PLATFORM_ORDER.indexOf(a.name);
            const bi = PLATFORM_ORDER.indexOf(b.name);
            if (ai !== -1 || bi !== -1) {
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            }
            return a.name.localeCompare(b.name);
          });
      }

      function rowsForPlatform(platform) {
        const available = new Set(platform.benches.keys());
        const rows = [];

        for (const group of BENCH_GROUPS) {
          const benches = group.benches.filter(name => available.has(name));
          if (benches.length > 0) {
            rows.push({ type: "group", name: group.name });
            for (const name of benches) {
              rows.push({ type: "bench", name });
            }
          }
        }

        const known = new Set(BENCH_GROUPS.flatMap(group => group.benches));
        const remaining = Array.from(available).filter(name => !known.has(name)).sort();
        if (remaining.length > 0) {
          rows.push({ type: "group", name: "Other" });
          for (const name of remaining) {
            rows.push({ type: "bench", name });
          }
        }

        return rows;
      }

      function formatDate(commit) {
        const source = commit.timestamp || commit.date;
        const date = new Date(source);
        if (Number.isNaN(date.getTime())) {
          return "";
        }
        return date.toLocaleDateString(undefined, {
          month: "2-digit",
          day: "2-digit"
        });
      }

      function formatValue(value) {
        const abs = Math.abs(value);
        if (abs >= 10000) {
          return Math.round(value).toLocaleString();
        }
        if (abs >= 1000) {
          return value.toLocaleString(undefined, { maximumFractionDigits: 1 });
        }
        if (abs >= 100) {
          return value.toLocaleString(undefined, { maximumFractionDigits: 2 });
        }
        if (abs >= 10) {
          return value.toLocaleString(undefined, { maximumFractionDigits: 2 });
        }
        return value.toLocaleString(undefined, { maximumFractionDigits: 3 });
      }

      function previousMetric(commits, index, benchName) {
        for (let i = index - 1; i >= 0; i -= 1) {
          const metric = commits[i].benches.get(benchName);
          if (metric) {
            return metric;
          }
        }
        return null;
      }

      function improvementPercent(current, previous) {
        if (!current || !previous || previous.value === 0) {
          return null;
        }
        const raw = ((current.value - previous.value) / Math.abs(previous.value)) * 100;
        return current.direction === "lower" ? -raw : raw;
      }

      function deltaClass(percent) {
        if (percent === null || Math.abs(percent) <= 1) {
          return "neutral";
        }
        if (percent > 0) {
          return percent > 5 ? "better-strong" : "better-soft";
        }
        return percent < -5 ? "worse-strong" : "worse-soft";
      }

      function formatDelta(percent) {
        if (percent === null || Math.abs(percent) <= 1) {
          return "";
        }
        const sign = percent > 0 ? "+" : "";
        return `${sign}${percent.toFixed(1)}%`;
      }

      function metricTitle(current, previous, percent) {
        const direction = current.direction === "lower" ? "lower is better" : "higher is better";
        if (!previous || percent === null) {
          return direction;
        }
        const delta = formatDelta(percent) || "within 1%";
        return `${direction}; ${delta} vs previous available commit`;
      }

      function appendText(parent, tagName, className, text) {
        const el = document.createElement(tagName);
        if (className) {
          el.className = className;
        }
        el.textContent = text;
        parent.appendChild(el);
        return el;
      }

      function renderPlatform(platform) {
        const section = document.createElement("section");
        section.className = "platform";
        section.dataset.platform = platform.name;

        const header = document.createElement("div");
        header.className = "platform-header";
        appendText(header, "h2", "platform-title", platform.name);
        appendText(
          header,
          "div",
          "platform-summary",
          `${platform.benches.size} metrics across ${platform.commits.length} commits`
        );
        section.appendChild(header);

        const tableWrap = document.createElement("div");
        tableWrap.className = "table-wrap";
        const table = document.createElement("table");

        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        appendText(headRow, "th", "benchmark-head", "Benchmark");
        for (const commit of platform.commits) {
          const th = document.createElement("th");
          const link = document.createElement(commit.url ? "a" : "span");
          link.className = "commit-link";
          link.textContent = commit.shortId;
          link.title = commit.message.split("\n")[0] || commit.id;
          if (commit.url) {
            link.href = commit.url;
            link.rel = "noopener";
          }
          th.appendChild(link);
          appendText(th, "span", "commit-date", formatDate(commit));
          headRow.appendChild(th);
        }
        thead.appendChild(headRow);
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        for (const row of rowsForPlatform(platform)) {
          const tr = document.createElement("tr");
          if (row.type === "group") {
            tr.className = "group-row";
            const td = appendText(tr, "td", "", row.name);
            td.colSpan = platform.commits.length + 1;
            tbody.appendChild(tr);
            continue;
          }

          const info = platform.benches.get(row.name) || {};
          const label = BENCH_LABELS[row.name] || row.name;
          const nameCell = document.createElement("td");
          nameCell.className = "benchmark-name";
          nameCell.textContent = label;
          appendText(nameCell, "span", "unit", info.unit || "");
          tr.appendChild(nameCell);

          platform.commits.forEach((commit, index) => {
            const metric = commit.benches.get(row.name);
            const td = document.createElement("td");
            td.className = "metric";
            if (!metric) {
              td.classList.add("missing");
              td.textContent = "-";
              tr.appendChild(td);
              return;
            }

            const previous = previousMetric(platform.commits, index, row.name);
            const percent = improvementPercent(metric, previous);
            td.classList.add(deltaClass(percent));
            td.title = metricTitle(metric, previous, percent);
            appendText(td, "span", "value", formatValue(metric.value));
            const delta = formatDelta(percent);
            if (delta) {
              appendText(td, "span", "delta", delta);
            }
            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        }
        table.appendChild(tbody);
        tableWrap.appendChild(table);
        section.appendChild(tableWrap);
        return section;
      }

      function setActivePlatform(platformName) {
        const showAll = platformName === "all";
        for (const section of document.querySelectorAll(".platform")) {
          section.hidden = !showAll && section.dataset.platform !== platformName;
        }
        for (const button of document.querySelectorAll(".platform-button")) {
          button.setAttribute("aria-pressed", String(button.dataset.platform === platformName));
        }
        if (platformName && platformName !== "all") {
          history.replaceState(null, "", `#${encodeURIComponent(platformName)}`);
        } else {
          history.replaceState(null, "", location.pathname);
        }
      }

      function renderControls(platforms) {
        const buttons = document.getElementById("platform-buttons");
        const makeButton = (label, platformName) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "platform-button";
          button.dataset.platform = platformName;
          button.textContent = label;
          button.addEventListener("click", () => setActivePlatform(platformName));
          buttons.appendChild(button);
        };

        makeButton("All", "all");
        for (const platform of platforms) {
          makeButton(platform.name, platform.name);
        }
      }

      function init() {
        const data = window.BENCHMARK_DATA || {};
        const platforms = buildPlatforms(data);

        document.getElementById("last-update").textContent =
          data.lastUpdate ? new Date(data.lastUpdate).toLocaleString() : "unknown";

        const repoLink = document.getElementById("repository-link");
        repoLink.href = data.repoUrl || "#";
        repoLink.textContent = data.repoUrl || "repository";

        const main = document.getElementById("platforms");
        if (platforms.length === 0) {
          appendText(main, "div", "empty", "No benchmark data found in data.js.");
          return;
        }

        renderControls(platforms);
        for (const platform of platforms) {
          main.appendChild(renderPlatform(platform));
        }

        const hashPlatform = decodeURIComponent(location.hash.replace(/^#/, ""));
        const initialPlatform = platforms.some(platform => platform.name === hashPlatform)
          ? hashPlatform
          : platforms[0].name;
        setActivePlatform(initialPlatform);
      }

      init();
    </script>
  </body>
</html>
