# Isolated Nano-only rotated-operand campaign; no main, PR or dev trigger.
name: x64-nano-rorxshift
on:
  push:
    branches: ["codex/x64-profiling"]
    paths: ["ci/x64_warning_audit.py", "ci/test_x64_warning_audit.py", ".github/workflows/x64-profile.yml", "ci/x64_coremark_compare.py"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    name: Nano wasmi execute / draw ${{ matrix.draw }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        draw: [1, 2]
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - name: Audit and test the measurement tools
        run: |
          python3 -m ci.lint_policy
          env -u GITHUB_STEP_SUMMARY python3 -m unittest ci.test_wasmi_performance ci.test_x64_warning_audit
      - uses: actions/checkout@v7
        with:
          ref: 92c1d465818d0f814b8c59b11146b5796af53059
          path: source-parent
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: fc373194005f969d4279ac295f1df62a916ee685
          path: source-rorxshift
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: wasmi-labs/wasmi-benchmarks
          ref: 16a3d7c8fdb05506c116a9451175732d1ac77099
          path: wasmi-benchmarks
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        id: rust-toolchain
      - name: Install benchmark system dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libfontconfig1-dev
      - uses: actions/cache@v6
        id: cargo-criterion-cache
        with:
          path: ~/.cargo/bin/cargo-criterion
          key: cargo-criterion-1.1.0-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rust-toolchain.outputs.cachekey }}
      - name: Install pinned cargo-criterion
        if: steps.cargo-criterion-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version 1.1.0 cargo-criterion
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: wasmi-x64-linux-jit
          workspaces: ". -> wasmi-target"
      - name: Save source and CPU identities
        run: |
          mkdir rorxshift-out
          lscpu > rorxshift-out/cpu.txt
          rustc --version > rorxshift-out/rustc.txt
          for name in parent rorxshift; do
            (cd "source-$name" && python3 -m ci.lint_policy)
            git -C "source-$name" rev-parse HEAD > "rorxshift-out/$name-source.txt"
          done
          cargo criterion --version | tee rorxshift-out/cargo-criterion.txt
          python3 - <<'PY'
          from pathlib import Path
          if '1.1.0' not in Path('rorxshift-out/cargo-criterion.txt').read_text():
              raise SystemExit('cargo-criterion version does not match the pinned measurement tool')
          PY
      - name: Validate the candidate and inherited BMI2 path before timing
        working-directory: source-rorxshift
        run: |
          cargo test --locked -p sf-nano-core -- --nocapture 2>&1 | tee ../rorxshift-out/correctness-core.log
          python3 - <<'PY'
          from pathlib import Path
          log = Path('../rorxshift-out/correctness-core.log').read_text()
          if 'BMI2 execution check skipped' in log:
              raise SystemExit('runner lacks BMI2: native instruction checks did not execute')
          PY
          cargo build --release --locked -p sf-nano-spectest --no-default-features --features jit \
            2>&1 | tee ../rorxshift-out/correctness-spec-build.log
          target/release/sf-nano-spectest --backend jit --log-level info \
            2>&1 | tee ../rorxshift-out/correctness-spec.log
          (cd .. && python3 -m ci.x64_warning_audit rorxshift-out/correctness-*.log)
      - name: Compare the complete pinned execution corpus
        run: |
          status=0
          taskset -c 1 setarch "$(uname -m)" -R python3 -m ci.wasmi_performance \
            --suite wasmi-benchmarks \
            --suite-sha 16a3d7c8fdb05506c116a9451175732d1ac77099 \
            --baseline-source source-parent --candidate-source source-rorxshift \
            --baseline-sha 92c1d465818d0f814b8c59b11146b5796af53059 \
            --candidate-sha fc373194005f969d4279ac295f1df62a916ee685 \
            --platform x64-linux --engine jit --category execute \
            --pilot-probability 80 --regression-probability 99.99 \
            --improvement-probability 99.99 --minimum-effect-percent 1.0 \
            --placement-metric execute/fibonacci-tail \
            --placement-metric execute/tiny_keccak \
            --placement-metric execute/json_parse \
            --placement-metric execute/mandelbrot \
            --family-jobs 2 --family-metric-count 20 --max-confirmation-runs 2 \
            --target-root wasmi-target --out-dir rorxshift-out/execute || status=$?
          if [[ -f rorxshift-out/execute/summary.md ]]; then
            cat rorxshift-out/execute/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nano-wasmi-rorxshift-${{ matrix.draw }}
          path: rorxshift-out/
          if-no-files-found: error
          retention-days: 30
