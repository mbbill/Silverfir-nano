# BRANCH-ONLY WORKFLOW — x64 JIT tuning campaign.
#
# Captures a perf profile of one benchmarks/wasi workload with nano's
# jitdump/native-dump exporters (core jit-debug feature) on an x64
# runner, and uploads the artifact for local analysis. This is the
# "find out where" instrument of the campaign: the standings lane names
# the slow cases, this lane names the hot code inside them.
#
# The push trigger fires only when the lane's own files change (which
# also registers the workflow so `gh workflow run x64-profile.yml
# --ref dev/x64-tuning` works). Normal use is dispatch with a workload.
#
# Delete this file and ci/x64_profile_capture.py with the rest of the
# dev/x64-** lane before merging into main.

name: x64-profile

on:
  push:
    branches:
      - "dev/x64-**"
    paths:
      - ".github/workflows/x64-profile.yml"
      - "ci/x64_profile_capture.py"
  workflow_dispatch:
    inputs:
      workload:
        description: "benchmarks/wasi workload name (as in run_tests.py)"
        required: true
        default: "coremark/coremark.wasm"
      engine:
        description: "Engine to profile"
        required: true
        default: "jit"
        type: choice
        options:
          - "jit"
          - "interp"
      seconds:
        description: "Self-timing target in seconds"
        required: true
        default: "10"

# No concurrency group: profile captures are independent and
# self-contained, and GitHub's one-pending-slot rule silently cancels
# batched dispatches if they share a group.

permissions:
  contents: read

jobs:
  profile:
    name: x64 profile / ${{ inputs.workload || 'coremark/coremark.wasm' }} / ${{ inputs.engine || 'jit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      WORKLOAD: ${{ inputs.workload || 'coremark/coremark.wasm' }}
      ENGINE: ${{ inputs.engine || 'jit' }}
      SECONDS_TARGET: ${{ inputs.seconds || '10' }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: x64-profile

      - name: Build sf-nano-cli with the jit-debug exporters
        run: |
          cargo build --release -p sf-nano-cli \
            --features sf-nano-core/jit-debug

      - name: Install perf and open perf events
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic
          # The versioned wrapper refuses on kernel mismatch; use the
          # tools binary directly.
          PERF_BIN="$(ls -d /usr/lib/linux-tools/*/perf | head -n1)"
          "$PERF_BIN" --version
          echo "PERF_BIN=$PERF_BIN" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.perf_event_paranoid=1
          sudo sysctl -w kernel.kptr_restrict=0

      - name: Record runner CPU
        run: |
          uname -a
          lscpu | grep -iE "model name|vendor" || true

      - name: Capture the profile
        run: |
          # Pinned like every measurement job; children inherit.
          taskset -c 1 setarch "$(uname -m)" -R \
            python3 ci/x64_profile_capture.py \
            --workload "$WORKLOAD" \
            --engine "$ENGINE" \
            --time "$SECONDS_TARGET" \
            --cli target/release/sf-nano-cli \
            --perf "$PERF_BIN" \
            --out-dir profile-out
          {
            echo "## x64 profile: ${WORKLOAD} (${ENGINE})"
            echo
            echo '```'
            head -n 60 profile-out/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: x64-profile-${{ github.run_id }}
          path: profile-out/
          if-no-files-found: warn
          retention-days: 30
