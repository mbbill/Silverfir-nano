# Isolated Nano-only campaign measurement; no main, PR or dev trigger.
name: x64-nano-coremark
on:
  push:
    branches: ["codex/x64-profiling"]
    paths: [".github/workflows/x64-profile.yml", "ci/x64_coremark_compare.py"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    name: Nano CoreMark / draw ${{ matrix.draw }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        draw: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - name: Audit and test the measurement tool
        run: |
          python3 -m ci.lint_policy
          env -u GITHUB_STEP_SUMMARY python3 -m unittest ci.test_x64_coremark_compare
      - uses: actions/checkout@v7
        with:
          ref: f73219f56a70b77028f0d79730c7efca29ba3439
          path: source-base
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 17f0914913b421c295e5cd514fd334edff9000af
          path: source-bulk
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: wasmi-labs/wasmi-benchmarks
          ref: 16a3d7c8fdb05506c116a9451175732d1ac77099
          path: wasmi-benchmarks
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: x64-nano-probes
      - name: Prepare identical probe manifests
        run: |
          python3 - <<'PYCODE'
          import json, os, shutil
          from pathlib import Path
          path = Path('sf-nano-core/src/vm/jit/arch/x86_64/inst.rs')
          original = (Path('source-bulk') / path).read_text()
          immediate_start = original.index('                        if dst != lhs_gp {\n                            // Keep two-operand ADD/SUB')
          immediate_end = original.index('                        if dst != lhs_gp {\n                            self.emit_gp_move_width', immediate_start)
          register_start = original.index('                if op == MachineIntBinaryOp::Add && dst != lhs_gp && dst != rhs_gp {')
          register_end = original.index('                // Handle aliasing:', register_start)
          import difflib
          Path('coremark-out').mkdir()
          for name, start, end in [('reg', immediate_start, immediate_end), ('offset', register_start, register_end)]:
              shutil.copytree('source-bulk', 'source-' + name, ignore=shutil.ignore_patterns('.git', 'target'))
              changed = original[:start] + original[end:]
              (Path('source-' + name) / path).write_text(changed)
              patch = ''.join(difflib.unified_diff(original.splitlines(True), changed.splitlines(True), fromfile='bulk/' + str(path), tofile=name + '/' + str(path)))
              Path('coremark-out/' + name + '.patch').write_text(patch)
          for name in ['base', 'bulk', 'reg', 'offset']:
              dest = Path(os.environ['RUNNER_TEMP']) / ('probe-' + name)
              shutil.copytree('ci/x64-probe', dest, ignore=shutil.ignore_patterns('target'))
              manifest = dest / 'Cargo.toml'
              source = Path('source-' + name).resolve() / 'sf-nano-core'
              manifest.write_text(manifest.read_text().replace('"../../sf-nano-core"', json.dumps(str(source))))
          PYCODE
      - name: Build every Nano revision before measuring
        run: |
          for name in base bulk reg offset; do
            cargo build --release --locked --manifest-path "$RUNNER_TEMP/probe-$name/Cargo.toml" \
              --target-dir probe-target 2>&1 | tee "coremark-out/build-$name.log"
            if rg '^warning(\[[^]]+\])?:' "coremark-out/build-$name.log"; then
              echo '::error::ACTION REQUIRED: compiler warning'
              exit 1
            fi
            cp probe-target/release/sf-x64-probe "coremark-out/$name"
            source_name="$name"
            if [[ "$name" == reg || "$name" == offset ]]; then source_name=bulk; fi
            git -C "source-$source_name" rev-parse HEAD > "coremark-out/$name-source.txt"
          done
      - name: Compare the exact CoreMark module
        run: |
          lscpu > coremark-out/cpu.txt
          rustc --version > coremark-out/rustc.txt
          sha256sum wasmi-benchmarks/res/wasm/coremark.wasm > coremark-out/wasm-sha256.txt
          taskset -c 1 setarch "$(uname -m)" -R python3 -m ci.x64_coremark_compare \
            --variant base="$PWD/coremark-out/base" \
            --variant bulk="$PWD/coremark-out/bulk" \
            --variant reg="$PWD/coremark-out/reg" \
            --variant offset="$PWD/coremark-out/offset" \
            --wasm wasmi-benchmarks/res/wasm/coremark.wasm --rounds 4 --out-dir coremark-out
      - name: Profile the base and full LEA revision
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic
          PERF_BIN="$(ls -d /usr/lib/linux-tools/*/perf | head -n1)"
          sudo sysctl -w kernel.perf_event_paranoid=1
          sudo sysctl -w kernel.kptr_restrict=0
          for name in base bulk; do
            taskset -c 1 setarch "$(uname -m)" -R python3 ci/x64_profile_capture.py \
              --perf "$PERF_BIN" --out-dir "profile-out/$name" -- \
              "$PWD/coremark-out/$name" wasmi-benchmarks/res/wasm/coremark.wasm coremark
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nano-coremark-lea-${{ matrix.draw }}
          path: |
            coremark-out/*.log
            coremark-out/*.json
            coremark-out/*.txt
            coremark-out/*.md
            coremark-out/*.patch
            profile-out/
          if-no-files-found: error
          retention-days: 30
