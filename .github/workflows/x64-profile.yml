# Isolated Nano-only campaign measurement; no main, PR or dev trigger.
name: x64-nano-coremark-loop-carry-confirm
on:
  push:
    branches: ["codex/x64-profiling"]
    paths: [".github/workflows/x64-profile.yml"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    name: Nano CoreMark confirmation / draw ${{ matrix.draw }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        draw: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - name: Audit and test the measurement tool
        run: |
          python3 -m ci.lint_policy
          env -u GITHUB_STEP_SUMMARY python3 -m unittest ci.test_x64_coremark_compare ci.test_x64_warning_audit
      - uses: actions/checkout@v7
        with:
          ref: 42396c9dba2da406348f4238b4f4dd673af25cd2
          path: source-parent
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 937ed3e09fcd959c47acf16e77cf5672c854580b
          path: source-carry
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: wasmi-labs/wasmi-benchmarks
          ref: 16a3d7c8fdb05506c116a9451175732d1ac77099
          path: wasmi-benchmarks
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: x64-nano-probes
      - name: Prepare identical probe manifests
        run: |
          python3 - <<'PYCODE'
          import json, os, shutil
          from pathlib import Path
          Path('coremark-out').mkdir()
          for name in ['parent', 'carry']:
              dest = Path(os.environ['RUNNER_TEMP']) / ('probe-' + name)
              shutil.copytree('ci/x64-probe', dest, ignore=shutil.ignore_patterns('target'))
              manifest = dest / 'Cargo.toml'
              source = Path('source-' + name).resolve() / 'sf-nano-core'
              manifest.write_text(manifest.read_text().replace('"../../sf-nano-core"', json.dumps(str(source))))
          PYCODE
      - name: Save and audit the source variants
        run: |
          for name in parent carry; do
            (cd "source-$name" && python3 -m ci.lint_policy)
          done
      - name: Validate candidate on the native CPU before timing
        working-directory: source-carry
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo test --locked -p sf-nano-core -- --nocapture 2>&1 | tee ../coremark-out/correctness-core.log
          if grep -q "BMI2 execution check skipped" ../coremark-out/correctness-core.log; then
            echo "Native BMI2 execution validation was skipped" >&2
            exit 1
          fi
          cargo test --locked -p sf-nano-core --no-default-features --features jit,interp \
            --test memory_length --test call_status --test integer_division --test integer_sums --test jump_table_membership 2>&1 | tee ../coremark-out/correctness-unguarded-memory.log
          cargo build --release --locked -p sf-nano-spectest --no-default-features --features jit \
            2>&1 | tee ../coremark-out/correctness-spec-build.log
          target/release/sf-nano-spectest --backend jit --log-level info \
            2>&1 | tee ../coremark-out/correctness-spec.log
          (cd .. && python3 -m ci.x64_warning_audit coremark-out/correctness-*.log)
      - name: Build every Nano revision before measuring
        env:
          CARGO_TERM_COLOR: never
        run: |
          for name in parent carry; do
            cargo build --release --locked --manifest-path "$RUNNER_TEMP/probe-$name/Cargo.toml" \
              --target-dir probe-target 2>&1 | tee "coremark-out/build-$name.log"
            python3 -m ci.x64_warning_audit "coremark-out/build-$name.log"
            cp probe-target/release/sf-x64-probe "coremark-out/$name"
            git -C "source-$name" rev-parse HEAD > "coremark-out/$name-source.txt"
          done
      - name: Compare the exact CoreMark module
        run: |
          lscpu > coremark-out/cpu.txt
          rustc --version > coremark-out/rustc.txt
          sha256sum wasmi-benchmarks/res/wasm/coremark.wasm > coremark-out/wasm-sha256.txt
          taskset -c 1 setarch "$(uname -m)" -R python3 -m ci.x64_coremark_compare \
            --variant parent="$PWD/coremark-out/parent" \
            --variant carry="$PWD/coremark-out/carry" \
            --wasm wasmi-benchmarks/res/wasm/coremark.wasm --rounds 12 --out-dir coremark-out
      - name: Capture the native code of every revision
        run: |
          for name in parent carry; do
            SF_NATIVE_DUMP_DIR="$PWD/native-out/$name" \
              "coremark-out/$name" wasmi-benchmarks/res/wasm/coremark.wasm coremark-dump
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nano-coremark-loop-carry-confirm-${{ matrix.draw }}
          path: |
            coremark-out/*.log
            coremark-out/*.json
            coremark-out/*.txt
            coremark-out/*.md
            native-out/
          if-no-files-found: error
          retention-days: 30
