# Isolated Nano-only campaign measurement; no main, PR or dev trigger.
name: x64-nano-coremark
on:
  push:
    branches: ["codex/x64-profiling"]
    paths: [".github/workflows/x64-profile.yml", "ci/x64_coremark_compare.py"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    name: Nano CoreMark / draw ${{ matrix.draw }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        draw: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - name: Audit and test the measurement tool
        run: |
          python3 -m ci.lint_policy
          env -u GITHUB_STEP_SUMMARY python3 -m unittest ci.test_x64_coremark_compare
      - uses: actions/checkout@v7
        with:
          ref: f73219f56a70b77028f0d79730c7efca29ba3439
          path: source-main
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ff5c13ee2a7013022e45e5696f5aaed9161c8b77
          path: source-bits
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 1e37ec0409b40b2191e06d417de34ded29c2096f
          path: source-bextr
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: wasmi-labs/wasmi-benchmarks
          ref: 16a3d7c8fdb05506c116a9451175732d1ac77099
          path: wasmi-benchmarks
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: x64-nano-probes
      - name: Prepare identical probe manifests
        run: |
          python3 - <<'PYCODE'
          import json, os, shutil
          from pathlib import Path
          Path('coremark-out').mkdir()
          for name in ['main', 'bits', 'bextr']:
              dest = Path(os.environ['RUNNER_TEMP']) / ('probe-' + name)
              shutil.copytree('ci/x64-probe', dest, ignore=shutil.ignore_patterns('target'))
              manifest = dest / 'Cargo.toml'
              source = Path('source-' + name).resolve() / 'sf-nano-core'
              manifest.write_text(manifest.read_text().replace('"../../sf-nano-core"', json.dumps(str(source))))
          PYCODE
      - name: Save and audit the source variants
        run: |
          for name in main bits bextr; do
            (cd "source-$name" && python3 -m ci.lint_policy)
          done
      - name: Validate candidate on the native CPU before timing
        working-directory: source-bextr
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo test --locked -p sf-nano-core -- --nocapture 2>&1 | tee ../coremark-out/correctness-core.log
          cargo build --release --locked -p sf-nano-spectest --no-default-features --features jit \
            2>&1 | tee ../coremark-out/correctness-spec-build.log
          target/release/sf-nano-spectest --backend jit --log-level info \
            2>&1 | tee ../coremark-out/correctness-spec.log
          if rg '^warning(\[[^]]+\])?:' ../coremark-out/correctness-*.log; then
            echo '::error::ACTION REQUIRED: compiler warning'
            exit 1
          fi
      - name: Build every Nano revision before measuring
        env:
          CARGO_TERM_COLOR: never
        run: |
          for name in main bits bextr; do
            cargo build --release --locked --manifest-path "$RUNNER_TEMP/probe-$name/Cargo.toml" \
              --target-dir probe-target 2>&1 | tee "coremark-out/build-$name.log"
            if rg '^warning(\[[^]]+\])?:' "coremark-out/build-$name.log"; then
              echo '::error::ACTION REQUIRED: compiler warning'
              exit 1
            fi
            cp probe-target/release/sf-x64-probe "coremark-out/$name"
            git -C "source-$name" rev-parse HEAD > "coremark-out/$name-source.txt"
          done
      - name: Compare the exact CoreMark module
        run: |
          lscpu > coremark-out/cpu.txt
          rustc --version > coremark-out/rustc.txt
          sha256sum wasmi-benchmarks/res/wasm/coremark.wasm > coremark-out/wasm-sha256.txt
          taskset -c 1 setarch "$(uname -m)" -R python3 -m ci.x64_coremark_compare \
            --variant main="$PWD/coremark-out/main" \
            --variant bits="$PWD/coremark-out/bits" \
            --variant bextr="$PWD/coremark-out/bextr" \
            --wasm wasmi-benchmarks/res/wasm/coremark.wasm --rounds 4 --out-dir coremark-out
      - name: Capture the native code of every revision
        run: |
          for name in main bits bextr; do
            SF_NATIVE_DUMP_DIR="$PWD/native-out/$name" \
              "coremark-out/$name" wasmi-benchmarks/res/wasm/coremark.wasm coremark-dump
          done
      - name: Verify which CPU path was emitted
        run: |
          objdump -D -b binary -m i386:x86-64 native-out/bextr/native_code.bin > coremark-out/bextr-disassembly.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          cpu = Path('coremark-out/cpu.txt').read_text()
          asm = Path('coremark-out/bextr-disassembly.txt').read_text()
          count = asm.count('bextr ')
          expected = 'AuthenticAMD' in cpu and ' bmi1 ' in cpu
          print(f'BEXTR instructions: {count}; AMD BMI1: {expected}')
          assert (count > 0) == expected
          PYCODE
      - name: Sample current CoreMark machine-code hotspots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic
          PERF_BIN="$(ls -d /usr/lib/linux-tools/*/perf | head -n1)"
          sudo sysctl -w kernel.perf_event_paranoid=1
          taskset -c 1 setarch "$(uname -m)" -R python3 ci/x64_profile_capture.py \
            --perf "$PERF_BIN" --out-dir profile-out/coremark -- \
            "$PWD/coremark-out/bextr" wasmi-benchmarks/res/wasm/coremark.wasm coremark
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nano-coremark-bextr-${{ matrix.draw }}
          path: |
            coremark-out/*.log
            coremark-out/*.json
            coremark-out/*.txt
            coremark-out/*.md
            native-out/
            profile-out/
          if-no-files-found: error
          retention-days: 30
