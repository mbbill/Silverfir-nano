# Isolated Nano-only campaign measurement; no main, PR or dev trigger.
name: x64-nano-recursive
on:
  push:
    branches: ["codex/x64-profiling"]
    paths: ["ci/x64_warning_audit.py", "ci/test_x64_warning_audit.py", ".github/workflows/x64-profile.yml", "ci/x64_coremark_compare.py"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    name: Nano recursive calls / draw ${{ matrix.draw }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        draw: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - name: Audit and test the measurement tool
        run: |
          python3 -m ci.lint_policy
          env -u GITHUB_STEP_SUMMARY python3 -m unittest ci.test_x64_coremark_compare ci.test_x64_warning_audit
      - uses: actions/checkout@v7
        with:
          ref: f73219f56a70b77028f0d79730c7efca29ba3439
          path: source-main
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 42396c9dba2da406348f4238b4f4dd673af25cd2
          path: source-parent
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 3b88ca70769f6544d58b6e796839ed6f68c6c7bf
          path: source-structured
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: wasmi-labs/wasmi-benchmarks
          ref: 16a3d7c8fdb05506c116a9451175732d1ac77099
          path: wasmi-benchmarks
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: x64-nano-probes
      - name: Prepare identical probe manifests
        run: |
          python3 - <<'PYCODE'
          import json, os, shutil
          from pathlib import Path
          Path('recursive-out').mkdir()
          for name in ['main', 'parent', 'structured']:
              dest = Path(os.environ['RUNNER_TEMP']) / ('probe-' + name)
              shutil.copytree('ci/x64-probe', dest, ignore=shutil.ignore_patterns('target'))
              manifest = dest / 'Cargo.toml'
              source = Path('source-' + name).resolve() / 'sf-nano-core'
              manifest.write_text(manifest.read_text().replace('"../../sf-nano-core"', json.dumps(str(source))))
          PYCODE
      - name: Save and audit the source variants
        run: |
          for name in main parent structured; do
            (cd "source-$name" && python3 -m ci.lint_policy)
          done
      - name: Validate candidate on the native CPU before timing
        working-directory: source-structured
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo test --locked -p sf-nano-core -- --nocapture 2>&1 | tee ../recursive-out/correctness-core.log
          if grep -q "BMI2 execution check skipped" ../recursive-out/correctness-core.log; then
            echo "Native BMI2 execution validation was skipped" >&2
            exit 1
          fi
          cargo test --locked -p sf-nano-core --no-default-features --features jit,interp \
            --test call_inlining --test memory_length --test call_status --test integer_division --test integer_sums --test jump_table_membership 2>&1 | tee ../recursive-out/correctness-unguarded-memory.log
          cargo build --release --locked -p sf-nano-spectest --no-default-features --features jit \
            2>&1 | tee ../recursive-out/correctness-spec-build.log
          target/release/sf-nano-spectest --backend jit --log-level info \
            2>&1 | tee ../recursive-out/correctness-spec.log
          (cd .. && python3 -m ci.x64_warning_audit recursive-out/correctness-*.log)
      - name: Build every Nano revision before measuring
        env:
          CARGO_TERM_COLOR: never
        run: |
          for name in main parent structured; do
            cargo build --release --locked --manifest-path "$RUNNER_TEMP/probe-$name/Cargo.toml" \
              --target-dir probe-target 2>&1 | tee "recursive-out/build-$name.log"
            python3 -m ci.x64_warning_audit "recursive-out/build-$name.log"
            cp probe-target/release/sf-x64-probe "recursive-out/$name"
            git -C "source-$name" rev-parse HEAD > "recursive-out/$name-source.txt"
          done
      - name: Compare the recursive execution workload
        run: |
          lscpu > recursive-out/cpu.txt
          rustc --version > recursive-out/rustc.txt
          sha256sum wasmi-benchmarks/res/wat/fibonacci-rec.wat > recursive-out/wasm-sha256.txt
          taskset -c 1 setarch "$(uname -m)" -R python3 -m ci.x64_coremark_compare \
            --variant main="$PWD/recursive-out/main" \
            --variant parent="$PWD/recursive-out/parent" \
            --variant structured="$PWD/recursive-out/structured" \
            --wasm wasmi-benchmarks/res/wat/fibonacci-rec.wat --mode i64 --input 35 --expected-output-i64 9227465 --seconds 2 --rounds 6 --out-dir recursive-out
      - name: Capture the native code of every revision
        run: |
          for name in main parent structured; do
            SF_NATIVE_DUMP_DIR="$PWD/native-out/$name" \
              "recursive-out/$name" wasmi-benchmarks/res/wat/fibonacci-rec.wat coremark-dump
          done
      - name: Sample parent and candidate recursive machine-code hotspots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic
          PERF_BIN="$(ls -d /usr/lib/linux-tools/*/perf | head -n1)"
          sudo sysctl -w kernel.perf_event_paranoid=1
          for name in parent structured; do
            taskset -c 1 setarch "$(uname -m)" -R python3 ci/x64_profile_capture.py \
              --perf "$PERF_BIN" --out-dir "profile-out/$name" -- \
              "$PWD/recursive-out/$name" wasmi-benchmarks/res/wat/fibonacci-rec.wat i64 35 10
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nano-recursive-structured-inline-${{ matrix.draw }}
          path: |
            recursive-out/*.log
            recursive-out/*.json
            recursive-out/*.txt
            recursive-out/*.md
            native-out/
            profile-out/
          if-no-files-found: error
          retention-days: 30
