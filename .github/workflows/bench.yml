name: bench

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Bench acts as both regression-tracking history (on push: main) and per-PR
# validation (on pull_request). Cancel older in-flight PR runs when a new
# push arrives to keep the queue small; main pushes always run to completion
# so every landed PR shows up as its own data point in the history.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  deployments: write

jobs:
  # -------- Native arches: real perf numbers --------
  bench-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64-linux
            runner: ubuntu-latest
            cli_path: target/release/sf-nano-cli
          - arch: arm64-linux
            runner: ubuntu-24.04-arm
            cli_path: target/release/sf-nano-cli
          - arch: arm64-darwin
            runner: macos-14
            cli_path: target/release/sf-nano-cli
          - arch: x64-windows
            runner: windows-latest
            cli_path: target/release/sf-nano-cli.exe
    name: bench (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Windows runners hit MAX_PATH on the deeply nested mcts_mem/ .alt/ paths;
      # enable Git long paths before checkout so it can write them.
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-${{ matrix.arch }}

      - name: Build sf-nano-cli (release, jit)
        run: cargo build --release -p sf-nano-cli --no-default-features --features jit

      - name: Run benchmarks
        run: python3 scripts/bench_publish.py --exec "${{ matrix.cli_path }}" --out-dir bench-output

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.arch }}
          path: bench-output/
          retention-days: 7

  # -------- ARMv7-A under QEMU --------
  bench-armv7-a:
    name: bench (armv7-a, qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: armv7-unknown-linux-musleabihf

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-armv7-a
          key: armv7-unknown-linux-musleabihf

      - name: Install qemu-user-static
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static

      - name: Build sf-nano-cli (armv7, release, jit)
        run: cargo build --release --target armv7-unknown-linux-musleabihf -p sf-nano-cli --no-default-features --features jit

      - name: Run benchmarks under qemu-arm-static
        run: |
          python3 scripts/bench_publish.py \
            --exec "qemu-arm-static -cpu cortex-a15 target/armv7-unknown-linux-musleabihf/release/sf-nano-cli" \
            --out-dir bench-output

      - uses: actions/upload-artifact@v4
        with:
          name: bench-armv7-a
          path: bench-output/
          retention-days: 7

  # -------- RISC-V 64 under QEMU --------
  bench-riscv64:
    name: bench (riscv64, qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-C linker=rust-lld -C target-feature=+crt-static -C link-self-contained=yes -C panic=abort"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: riscv64gc-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-riscv64
          key: riscv64gc-unknown-linux-musl

      - name: Install qemu-user-static
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static

      - name: Build sf-nano-cli (riscv64, release, jit)
        run: cargo build --release --target riscv64gc-unknown-linux-musl -p sf-nano-cli --no-default-features --features jit

      - name: Run benchmarks under qemu-riscv64-static
        run: |
          python3 scripts/bench_publish.py \
            --exec "qemu-riscv64-static target/riscv64gc-unknown-linux-musl/release/sf-nano-cli" \
            --out-dir bench-output

      - uses: actions/upload-artifact@v4
        with:
          name: bench-riscv64
          path: bench-output/
          retention-days: 7

  # -------- RISC-V 32 under QEMU (nightly + Zig linker) --------
  bench-riscv32:
    name: bench (riscv32, qemu)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUSTFLAGS: "-C linker=${{ github.workspace }}/scripts/zig-riscv32-linux-musl-cc.sh -C target-feature=+crt-static -C link-self-contained=no -C panic=abort"
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/target/zig-cache
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-riscv32
          key: riscv32gc-unknown-linux-musl

      - name: Install qemu-user-static
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static

      - uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      - name: Build sf-nano-cli (riscv32, release, jit, build-std)
        run: |
          cargo +nightly build -Z build-std=std,panic_abort \
            --release \
            --target riscv32gc-unknown-linux-musl \
            -p sf-nano-cli --no-default-features --features jit

      - name: Run benchmarks under qemu-riscv32-static
        run: |
          python3 scripts/bench_publish.py \
            --exec "qemu-riscv32-static target/riscv32gc-unknown-linux-musl/release/sf-nano-cli" \
            --out-dir bench-output

      - uses: actions/upload-artifact@v4
        with:
          name: bench-riscv32
          path: bench-output/
          retention-days: 7

  # -------- Publish all results to gh-pages, serialised --------
  publish:
    name: publish (${{ matrix.arch }} / ${{ matrix.direction }})
    needs: [bench-native, bench-armv7-a, bench-riscv64, bench-riscv32]
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        arch: [x64-linux, arm64-linux, arm64-darwin, x64-windows, armv7-a, riscv64, riscv32]
        direction: [higher, lower]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true
        with:
          name: bench-${{ matrix.arch }}
          path: bench-output

      - name: Check artifact present and non-empty
        id: check
        run: |
          if [ -f "bench-output/${{ matrix.direction }}.json" ] && [ "$(cat bench-output/${{ matrix.direction }}.json)" != "[]" ]; then
            echo "have_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_results=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to gh-pages
        if: steps.check.outputs.have_results == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: "${{ matrix.arch }} (${{ matrix.direction == 'higher' && 'higher is better' || 'lower is better' }})"
          tool: ${{ matrix.direction == 'higher' && 'customBiggerIsBetter' || 'customSmallerIsBetter' }}
          output-file-path: bench-output/${{ matrix.direction }}.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: "200%"
          comment-on-alert: false
          fail-on-alert: false

  dashboard:
    name: publish dashboard UI
    needs: publish
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-dashboard

      - name: Install compact benchmark dashboard
        run: |
          set -euo pipefail
          mkdir -p gh-pages-dashboard/dev/bench
          cp .github/bench-dashboard/index.html gh-pages-dashboard/dev/bench/index.html
          cd gh-pages-dashboard
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/bench/index.html
          if git diff --cached --quiet; then
            echo "Dashboard UI already current"
            exit 0
          fi
          git commit -m "Update benchmark dashboard UI"
          git push origin HEAD:gh-pages
