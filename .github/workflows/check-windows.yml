name: check-windows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SF_CHECK_NO_WSL_REEXEC: "1"

jobs:
  check:
    name: full (x64 native, no WSL)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Some tracked design-tree artifacts have deeply nested .alt/ paths that
      # exceed Windows' 260-char MAX_PATH. Enable Git long-path support before
      # checkout so it can write them (actions/checkout reads --system config).
      - name: Enable Git long paths
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract testsuite SHA
        id: testsuite
        shell: bash
        run: |
          sha=$(grep -E '^const TESTSUITE_VERSION:' sf-nano-spectest/build.rs | sed -E 's/.*"([0-9a-f]+)".*/\1/')
          if [ -z "$sha" ]; then echo "could not parse TESTSUITE_VERSION" >&2; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache WebAssembly testsuite
        uses: actions/cache@v4
        with:
          path: target/webassembly-testsuite
          key: testsuite-${{ steps.testsuite.outputs.sha }}

      - name: Install Rust (stable, MSVC host)
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          # check.py's Windows phase cross-checks arm64-linux + x64-windows-gnu
          # (cargo check only, no linker), and runs bare-smoke on thumbv8m/riscv32imac.
          targets: x86_64-pc-windows-msvc,x86_64-pc-windows-gnu,aarch64-unknown-linux-gnu,thumbv8m.main-none-eabihf,riscv32imac-unknown-none-elf

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run check.py full (native phase only)
        run: python scripts\check.py full --install-targets

      - name: Upload check logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-windows-logs
          path: target/check-*-logs/
          if-no-files-found: ignore
          retention-days: 14
