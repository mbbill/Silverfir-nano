name: check-linux

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: full (x64, all targets)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract testsuite SHA
        id: testsuite
        run: |
          sha=$(grep -E '^const TESTSUITE_VERSION:' sf-nano-spectest/build.rs | sed -E 's/.*"([0-9a-f]+)".*/\1/')
          if [ -z "$sha" ]; then echo "could not parse TESTSUITE_VERSION" >&2; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache WebAssembly testsuite
        uses: actions/cache@v4
        with:
          path: target/webassembly-testsuite
          key: testsuite-${{ steps.testsuite.outputs.sha }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-unknown-linux-gnu,armv7-unknown-linux-musleabihf,riscv64gc-unknown-linux-musl,thumbv8m.main-none-eabihf,riscv32imac-unknown-none-elf

      - name: Install Rust (nightly + rust-src for riscv32 build-std)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install QEMU user-static
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static

      - name: Install Zig (RV32 musl C linker)
        # 0.13.0 ships no `lib/libc/musl/crt/riscv32/{crti,crtn}.s`, so the
        # musl CRT sub-compilation fails for the riscv32gc-unknown-linux-musl
        # target. 0.15.x has rv32 musl support and matches the local
        # toolchain used by the project's `scripts/zig-riscv32-linux-musl-cc.sh`.
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.0

      - name: Run check.py --all-targets
        run: python3 scripts/check.py --install-targets --all-targets

      - name: Upload check logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-linux-logs
          path: target/check*-logs/
          if-no-files-found: ignore
          retention-days: 14
