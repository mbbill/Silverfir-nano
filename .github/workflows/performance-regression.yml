name: performance-regression

on:
  pull_request:
  push:
    branches:
      - main
      - "dev/**"
    # Docs and design-memory pushes cannot change a measurement, and a
    # run they trigger can cancel a queued benchmark run through main's
    # one-pending-slot rule.
    paths-ignore:
      - "docs/**"
      - "mcts_mem/**"
  workflow_dispatch:
    inputs:
      baseline:
        description: "Baseline ref; empty means main merge-base (or HEAD^ on main)"
        required: false
        type: string
      calibration:
        description: "Compare two builds of the same commit to measure CI drift"
        required: true
        default: false
        type: boolean
      blocks:
        description: "Initial alternating blocks; each block has two paired samples"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  prepare:
    name: resolve refs and build dev branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Dev failures stay visible in logs but must not trigger failure email.
    # They are action-required soft failures, not successful validation.
    continue-on-error: ${{ startsWith(github.ref, 'refs/heads/dev/') }}
    outputs:
      baseline: ${{ steps.refs.outputs.baseline }}
      candidate: ${{ steps.refs.outputs.candidate }}
      blocks: ${{ steps.refs.outputs.blocks }}
      calibration: ${{ steps.refs.outputs.calibration }}
      matrix: ${{ steps.refs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve baseline and candidate
        id: refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          INPUT_BASELINE: ${{ inputs.baseline }}
          INPUT_BLOCKS: ${{ inputs.blocks }}
          INPUT_CALIBRATION: ${{ inputs.calibration }}
        run: |
          set -euo pipefail
          candidate="$GITHUB_SHA"
          calibration="${INPUT_CALIBRATION:-false}"

          if [[ "$calibration" == "true" ]]; then
            baseline="$candidate"
          elif [[ -n "${INPUT_BASELINE:-}" ]]; then
            if baseline="$(git rev-parse "${INPUT_BASELINE}^{commit}" 2>/dev/null)"; then
              :
            else
              git fetch --quiet origin "$INPUT_BASELINE"
              baseline="$(git rev-parse "FETCH_HEAD^{commit}")"
            fi
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            baseline="$PR_BASE"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            if [[ -n "${PUSH_BEFORE:-}" && \
                  "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              baseline="$PUSH_BEFORE"
            else
              baseline="$(git rev-parse "${candidate}^")"
            fi
          else
            git fetch --quiet origin main
            baseline="$(git merge-base origin/main "$candidate")"
          fi

          blocks="${INPUT_BLOCKS:-2}"
          matrix="$(python3 - <<'PY'
          import json
          import os

          platforms = [
              {
                  "platform": "x64-linux",
                  "runner": "ubuntu-latest",
                  "target": "",
                  "runner_prefix": "",
                  "exe": "",
                  "dev": True,
              },
              {
                  "platform": "arm64-linux",
                  "runner": "ubuntu-24.04-arm",
                  "target": "",
                  "runner_prefix": "",
                  "exe": "",
                  "dev": True,
              },
              {
                  "platform": "arm64-darwin",
                  "runner": "macos-14",
                  "target": "",
                  "runner_prefix": "",
                  "exe": "",
                  "dev": True,
              },
              {
                  "platform": "x64-windows",
                  "runner": "windows-latest",
                  "target": "",
                  "runner_prefix": "",
                  "exe": ".exe",
                  "dev": True,
              },
              {
                  "platform": "cross-armv7-a",
                  "runner": "ubuntu-latest",
                  "target": "armv7-unknown-linux-musleabihf",
                  "runner_prefix": "qemu-arm-static -cpu cortex-a15",
                  "exe": "",
                  "dev": False,
              },
              {
                  "platform": "cross-riscv64",
                  "runner": "ubuntu-latest",
                  "target": "riscv64gc-unknown-linux-musl",
                  "runner_prefix": "qemu-riscv64-static",
                  "exe": "",
                  "dev": False,
              },
              {
                  "platform": "cross-riscv32",
                  "runner": "ubuntu-latest",
                  "target": "riscv32gc-unknown-linux-musl",
                  "runner_prefix": "qemu-riscv32-static",
                  "exe": "",
                  "dev": False,
              },
          ]
          dev_only = os.environ["GITHUB_REF"].startswith("refs/heads/dev/")
          include = []
          for platform in platforms:
              if dev_only and not platform["dev"]:
                  continue
              row = {key: value for key, value in platform.items() if key != "dev"}
              row["mode"] = (
                  "correctness"
                  if platform["runner_prefix"]
                  else "performance"
              )
              for engine in ("jit", "interp"):
                  include.append(dict(row, engine=engine))
          performance_jobs = sum(
              row["mode"] == "performance" for row in include
          )
          for row in include:
              row["family_jobs"] = performance_jobs
          print(json.dumps({"include": include}, separators=(",", ":")))
          PY
          )"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "blocks=$blocks" >> "$GITHUB_OUTPUT"
          echo "calibration=$calibration" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "### Performance comparison"
            echo
            echo "- baseline: \`$baseline\`"
            echo "- candidate: \`$candidate\`"
            echo "- initial paired samples: \`$((blocks * 2))\`"
            echo "- order: \`ABAB / BABA\` alternating"
            echo "- targeted pair budget: \`6..24\`"
            echo "- pilot direction probability: \`80%\`"
            echo "- regression probability: \`99.99%\`"
            echo "- improvement probability: \`99.99%\`"
            echo "- model: \`paired log delta + adaptive Student-t confirmation\`"
            echo "- calibration: \`$calibration\`"
            echo "- wasmi-benchmarks: \`x64-linux + arm64-linux, JIT + interpreter\`"
            echo "- wasmi CoreMark score: \`disabled\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test CI implementation
        # Without the env scrub, test fixtures that exercise the summary
        # writer leak synthetic FAILED tables into the real run summary.
        run: env -u GITHUB_STEP_SUMMARY python3 -m unittest discover -s ci -p 'test_*.py'

      - name: Surface lint suppression debt
        id: lint-policy
        continue-on-error: true
        run: python3 -m ci.lint_policy

      - name: Mark lint suppression debt as action required
        if: steps.lint-policy.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Lint suppression audit"
            echo
            echo "> [!CAUTION]"
            echo "> **ACTION REQUIRED.** The repository contains unreviewed"
            echo "> Rust lint suppressions. Performance measurement continues"
            echo "> so correctness debt does not hide performance data; the"
            echo "> independent correctness workflow remains a hard failure."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Lint suppression audit::Unreviewed Rust lint suppressions are present; benchmark measurement will continue."

      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev/')

      - uses: Swatinem/rust-cache@v2.9.1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev/')
        with:
          shared-key: dev-build

      - name: cargo build (workspace)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev/')
        run: cargo build --workspace

      - name: Surface architecture-sensitive warnings
        id: warning-audit
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev/')
        continue-on-error: true
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          status=0

          audit() {
            local name="$1"
            shift
            local log
            local rc
            log="$(mktemp)"
            echo "::group::$name"
            "$@" 2>&1 | tee "$log"
            rc="${PIPESTATUS[0]}"
            echo "::endgroup::"
            if [[ "$rc" -ne 0 ]] || grep -qE '^warning(\[[^]]+\])?:' "$log"; then
              status=1
            fi
            rm -f "$log"
          }

          audit "release / default features" \
            cargo check --release -p sf-nano-core
          audit "release / JIT only" \
            cargo check --release -p sf-nano-core \
              --no-default-features --features jit
          audit "release / interpreter only" \
            cargo check --release -p sf-nano-core \
              --no-default-features --features interp

          if [[ "$status" -ne 0 ]]; then
            {
              echo "## Warning audit"
              echo
              echo "> [!CAUTION]"
              echo "> **ACTION REQUIRED.** One or more representative release"
              echo "> configurations emitted compiler warnings. The benchmark"
              echo "> will continue so correctness debt does not hide performance"
              echo "> data; inspect this step's three log groups."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Warning audit::Correctness warning debt is present; benchmark measurement will continue."
          fi

          exit "$status"

      - name: Mark dev soft-fail as action required
        if: failure() && startsWith(github.ref, 'refs/heads/dev/')
        run: |
          {
            echo "## Dev CI soft-fail"
            echo
            echo "> [!CAUTION]"
            echo "> **ACTION REQUIRED.** Email is suppressed for dev branches,"
            echo "> but a preceding step failed. This is not a passing result."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Dev CI soft-fail::Action required; this run did not pass."


  report:
    name: run report
    needs: [prepare, compare, compare-confirm, wasmi, wasmi-confirm]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Collect result artifacts
        uses: actions/download-artifact@v7
        with:
          path: run-artifacts

      - name: Write the consolidated report
        run: |
          python3 -m ci.summarize_run --artifacts-dir run-artifacts >> "$GITHUB_STEP_SUMMARY"

  compare:
    name: ${{ matrix.platform }} / ${{ matrix.engine }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # See CLAUDE.md and AGENTS.md: this suppresses dev failure email only.
    # A failed dev job still requires correction.
    continue-on-error: ${{ startsWith(github.ref, 'refs/heads/dev/') }}
    strategy:
      fail-fast: false
      # prepare emits eight native rows for dev/** and fourteen rows for
      # PR, main, and workflow_dispatch. Explicit rows avoid matrix
      # include/exclude re-adding partial platform entries.
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/perf-target
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/perf-zig-cache
    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.candidate }}

      - name: Checkout baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.baseline }}
          path: baseline

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.target != 'riscv32gc-unknown-linux-musl'
        with:
          targets: ${{ matrix.target }}

      - uses: dtolnay/rust-toolchain@nightly
        if: matrix.target == 'riscv32gc-unknown-linux-musl'
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: perf-${{ matrix.platform }}-${{ matrix.engine }}
          workspaces: ". -> perf-target"

      - name: Install QEMU user-static
        if: matrix.runner_prefix != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static

      - name: Cache Zig
        if: matrix.target == 'riscv32gc-unknown-linux-musl'
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/zig/0.14.0/x86_64
          key: zig-0.14.0-linux-x64

      - name: Install Zig
        if: matrix.target == 'riscv32gc-unknown-linux-musl'
        run: bash ci/install_zig.sh

      - name: Build baseline and candidate
        env:
          ENGINE: ${{ matrix.engine }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          python3 -m ci.performance_build \
            --baseline-source baseline \
            --candidate-source . \
            --out-dir perf-bin \
            --engine "$ENGINE" \
            --platform "$PLATFORM" \
            --target "$TARGET" \
            --exe-suffix "$EXE" \
            --baseline-sha "${{ needs.prepare.outputs.baseline }}" \
            --candidate-sha "${{ needs.prepare.outputs.candidate }}"

      - name: Record runner CPU
        shell: bash
        run: |
          uname -a || true
          lscpu 2>/dev/null | grep -iE "model name|vendor|bios" || true
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true

      - name: Build the Darwin ASLR pin shim
        if: runner.os == 'macOS'
        run: cc -O2 -o /tmp/noaslr ci/noaslr.c && /tmp/noaslr /usr/bin/true

      - name: Run benchmark suite
        env:
          BASELINE_SHA: ${{ needs.prepare.outputs.baseline }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate }}
          BLOCKS: ${{ needs.prepare.outputs.blocks }}
          ENGINE: ${{ matrix.engine }}
          PLATFORM: ${{ matrix.platform }}
          MODE: ${{ matrix.mode }}
          RUNNER_PREFIX: ${{ matrix.runner_prefix }}
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          args=(
            -m ci.performance
            --baseline-exec "perf-bin/baseline${EXE}"
            --candidate-exec "perf-bin/candidate${EXE}"
            --engine "$ENGINE"
            --platform "$PLATFORM"
            --baseline-sha "$BASELINE_SHA"
            --candidate-sha "$CANDIDATE_SHA"
            --build-metadata "perf-bin/build-metadata.json"
            --blocks "$BLOCKS"
            --min-pairs 6
            --max-pairs 24
            --pilot-probability 80
            --regression-probability 99.99
            --improvement-probability 99.99
            --minimum-effect-percent 1.0
            # PLACEMENT rows cover the per-binary layout class the
            # certified floors cannot: their swings track the image's
            # address layout, not its code. The list stays until a
            # successor (layout jiggle or an instruction-count lane)
            # can prove a given row's swing is layout.
            --placement-metric sha256
            --placement-metric stream-Scale
            --placement-metric stream-Add
            --placement-metric stream-Triad
            --placement-metric c-ray
            --placement-metric lz4-decompress
            --placement-metric mandelbrot
            --family-jobs "${{ matrix.family_jobs }}"
            --out-dir "perf-output/${ENGINE}"
          )
          # Pin each benchmark process's address layout: a score must be a
          # property of the image, not of the launch draw. Linux inherits
          # the setarch personality; Darwin pins per spawn via the shim;
          # Windows is pinned at link time (performance_build).
          pin=""
          case "$(uname -s)" in
            Linux)  pin="taskset -c 1 setarch $(uname -m) -R" ;;
            Darwin) pin="/tmp/noaslr" ;;
          esac
          if [[ -n "$RUNNER_PREFIX" ]]; then
            args+=(--runner-prefix "$RUNNER_PREFIX")
          elif [[ -n "$pin" ]]; then
            args+=(--runner-prefix "$pin")
          fi
          if [[ "$MODE" == "correctness" ]]; then
            args+=(--correctness-only)
          fi
          status=0
          python3 "${args[@]}" || status=$?
          if [[ -f "perf-output/${ENGINE}/summary.md" ]]; then
            cat "perf-output/${ENGINE}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          # A pure regression verdict (exit 1) in perf mode is not final:
          # runs of byte-identical sources have flagged disjoint row sets,
          # so one runner's verdict confounds the change with the draw.
          # The confirm job re-measures flagged rows on an independent
          # runner and fails only what reproduces. Build, correctness,
          # and harness failures stay fatal right here.
          if [[ "$status" -eq 1 && "$MODE" != "correctness" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> Regressions above are forwarded to cross-run confirmation." >> "$GITHUB_STEP_SUMMARY"
            status=0
          fi
          if [[ "$status" -ne 0 && "$GITHUB_REF" == refs/heads/dev/* ]]; then
            echo "::warning title=Dev performance soft-fail::Action required; see the job summary and artifact."
          fi
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-${{ matrix.platform }}-${{ matrix.engine }}
          path: |
            perf-output/${{ matrix.engine }}/
            perf-bin/build-metadata.json
          if-no-files-found: warn
          retention-days: 14

      - name: Mark dev soft-fail as action required
        if: failure() && startsWith(github.ref, 'refs/heads/dev/')
        run: |
          {
            echo
            echo "> [!CAUTION]"
            echo "> **SOFT-FAIL — ACTION REQUIRED.** Email is suppressed for"
            echo "> dev branches, but a preceding step failed. This is not a pass."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Dev CI soft-fail::Action required; this job did not pass."

  compare-confirm:
    name: confirm / ${{ matrix.platform }} / ${{ matrix.engine }}
    needs: [prepare, compare]
    # Without this, one crashed primary cell skips the entire
    # confirmation layer and every other cell's flagged regressions go
    # unadjudicated while the run page stays green.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # See CLAUDE.md and AGENTS.md: this suppresses dev failure email only.
    # A failed dev job still requires correction.
    continue-on-error: ${{ startsWith(github.ref, 'refs/heads/dev/') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/perf-target
    steps:
      - name: Fetch the primary verdict
        if: matrix.mode != 'correctness'
        # A primary cell that failed before measuring uploads no verdict;
        # a missing artifact means nothing to confirm here, and that
        # cell's own red job stays the visible signal.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: performance-${{ matrix.platform }}-${{ matrix.engine }}
          # Outside the workspace: the checkout below cleans the workspace
          # and would silently delete the downloaded verdict.
          path: ${{ runner.temp }}/primary

      - name: Decide whether confirmation is needed
        id: decide
        if: matrix.mode != 'correctness'
        env:
          ENGINE: ${{ matrix.engine }}
          PRIMARY_DIR: ${{ runner.temp }}/primary
        run: |
          set -euo pipefail
          flagged=$(python3 -c "import json, os, pathlib; doc = pathlib.Path(os.environ['PRIMARY_DIR']) / 'perf-output' / os.environ['ENGINE'] / 'comparison.json'; tests = (json.loads(doc.read_text(encoding='utf-8')).get('tests') or {}) if doc.is_file() else {}; print(' '.join(sorted({name for t in tests.values() for name, m in t.get('metrics', {}).items() if m.get('status') == 'REGRESSION'})))")
          if [[ -n "$flagged" ]]; then confirm=true; else confirm=false; fi
          echo "confirm=$confirm" >> "$GITHUB_OUTPUT"
          echo "flagged=$flagged" >> "$GITHUB_OUTPUT"
          echo "primary flagged rows: ${flagged:-none}"

      - name: Enable Git long paths
        if: steps.decide.outputs.confirm == 'true' && runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout candidate
        if: steps.decide.outputs.confirm == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.candidate }}

      - name: Checkout baseline
        if: steps.decide.outputs.confirm == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.baseline }}
          path: baseline

      - uses: dtolnay/rust-toolchain@stable
        if: steps.decide.outputs.confirm == 'true'
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2.9.1
        if: steps.decide.outputs.confirm == 'true'
        with:
          shared-key: perf-${{ matrix.platform }}-${{ matrix.engine }}
          workspaces: ". -> perf-target"

      - name: Build baseline and candidate
        if: steps.decide.outputs.confirm == 'true'
        env:
          ENGINE: ${{ matrix.engine }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          python3 -m ci.performance_build \
            --baseline-source baseline \
            --candidate-source . \
            --out-dir perf-bin \
            --engine "$ENGINE" \
            --platform "$PLATFORM" \
            --target "$TARGET" \
            --exe-suffix "$EXE" \
            --baseline-sha "${{ needs.prepare.outputs.baseline }}" \
            --candidate-sha "${{ needs.prepare.outputs.candidate }}"

      - name: Record runner CPU
        if: steps.decide.outputs.confirm == 'true'
        run: |
          uname -a || true
          lscpu 2>/dev/null | grep -iE "model name|vendor|bios" || true
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true

      - name: Build the Darwin ASLR pin shim
        if: steps.decide.outputs.confirm == 'true' && runner.os == 'macOS'
        run: cc -O2 -o /tmp/noaslr ci/noaslr.c && /tmp/noaslr /usr/bin/true

      - name: Re-measure the flagged rows on this runner
        if: steps.decide.outputs.confirm == 'true'
        env:
          BASELINE_SHA: ${{ needs.prepare.outputs.baseline }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate }}
          BLOCKS: ${{ needs.prepare.outputs.blocks }}
          ENGINE: ${{ matrix.engine }}
          PLATFORM: ${{ matrix.platform }}
          RUNNER_PREFIX: ${{ matrix.runner_prefix }}
          EXE: ${{ matrix.exe }}
          FLAGGED: ${{ steps.decide.outputs.flagged }}
        run: |
          set -euo pipefail
          # The rows under test were pre-registered by the primary run, so
          # this is a single re-test per row on independent hardware: the
          # uncorrected gate probability with the same practical floor.
          # Only the flagged rows are re-measured, keeping this job well
          # inside the ten-minute budget.
          args=(
            -m ci.performance
            --baseline-exec "perf-bin/baseline${EXE}"
            --candidate-exec "perf-bin/candidate${EXE}"
            --engine "$ENGINE"
            --platform "$PLATFORM"
            --baseline-sha "$BASELINE_SHA"
            --candidate-sha "$CANDIDATE_SHA"
            --build-metadata "perf-bin/build-metadata.json"
            --blocks "$BLOCKS"
            --min-pairs 6
            --max-pairs 24
            --pilot-probability 80
            --regression-probability 99
            --improvement-probability 99.99
            --minimum-effect-percent 1.0
            --placement-metric sha256
            --placement-metric stream-Scale
            --placement-metric stream-Add
            --placement-metric stream-Triad
            --placement-metric c-ray
            --placement-metric lz4-decompress
            --placement-metric mandelbrot
            --family-jobs 1
            --out-dir "perf-output-confirm/${ENGINE}"
          )
          pin=""
          case "$(uname -s)" in
            Linux)  pin="taskset -c 1 setarch $(uname -m) -R" ;;
            Darwin) pin="/tmp/noaslr" ;;
          esac
          if [[ -n "$RUNNER_PREFIX" ]]; then
            args+=(--runner-prefix "$RUNNER_PREFIX")
          elif [[ -n "$pin" ]]; then
            args+=(--runner-prefix "$pin")
          fi
          for metric in $FLAGGED; do
            args+=(--only "$metric")
          done
          python3 "${args[@]}" || true
          if [[ -f "perf-output-confirm/${ENGINE}/summary.md" ]]; then
            cat "perf-output-confirm/${ENGINE}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cross-run verdict
        if: steps.decide.outputs.confirm == 'true'
        env:
          ENGINE: ${{ matrix.engine }}
          PRIMARY_DIR: ${{ runner.temp }}/primary
        run: |
          set -euo pipefail
          status=0
          python3 -m ci.perf_confirm \
            --primary "${PRIMARY_DIR}/perf-output/${ENGINE}/comparison.json" \
            --confirm "perf-output-confirm/${ENGINE}/comparison.json" \
            --summary-out verdict.md || status=$?
          if [[ -f verdict.md ]]; then
            cat verdict.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: always() && steps.decide.outputs.confirm == 'true'
        with:
          name: performance-confirm-${{ matrix.platform }}-${{ matrix.engine }}
          path: perf-output-confirm/${{ matrix.engine }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Mark dev soft-fail as action required
        if: failure() && startsWith(github.ref, 'refs/heads/dev/')
        run: |
          {
            echo
            echo "> [!CAUTION]"
            echo "> **SOFT-FAIL — ACTION REQUIRED.** Email is suppressed for"
            echo "> dev branches, but a preceding step failed. This is not a pass."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Dev CI soft-fail::Action required; this job did not pass."

  wasmi:
    name: wasmi / ${{ matrix.platform }} / ${{ matrix.engine }} / ${{ matrix.category }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    # Dev continue-on-error suppresses failure email only. A failure remains
    # action-required and is surfaced in the summary below.
    continue-on-error: ${{ startsWith(github.ref, 'refs/heads/dev/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64-linux
            runner: ubuntu-latest
            engine: jit
            category: execute
          - platform: x64-linux
            runner: ubuntu-latest
            engine: jit
            category: startup
          - platform: x64-linux
            runner: ubuntu-latest
            engine: interp
            category: execute
          - platform: x64-linux
            runner: ubuntu-latest
            engine: interp
            category: startup
          - platform: arm64-linux
            runner: ubuntu-24.04-arm
            engine: jit
            category: execute
          - platform: arm64-linux
            runner: ubuntu-24.04-arm
            engine: jit
            category: startup
          - platform: arm64-linux
            runner: ubuntu-24.04-arm
            engine: interp
            category: execute
          - platform: arm64-linux
            runner: ubuntu-24.04-arm
            engine: interp
            category: startup
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.candidate }}

      - name: Checkout baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.baseline }}
          path: baseline

      - name: Checkout pinned wasmi-benchmarks
        uses: actions/checkout@v7
        with:
          repository: wasmi-labs/wasmi-benchmarks
          ref: 16a3d7c8fdb05506c116a9451175732d1ac77099
          path: wasmi-benchmarks
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        id: rust-toolchain

      - name: Install wasmi benchmark system dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libfontconfig1-dev

      - name: Restore cargo-criterion
        id: cargo-criterion-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-criterion
          key: cargo-criterion-1.1.0-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rust-toolchain.outputs.cachekey }}

      - name: Install pinned cargo-criterion
        if: steps.cargo-criterion-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version 1.1.0 cargo-criterion

      - name: Verify cargo-criterion
        run: |
          set -euo pipefail
          cargo criterion --version | grep -F '1.1.0'

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: wasmi-${{ matrix.platform }}-${{ matrix.engine }}
          workspaces: ". -> wasmi-target"

      - name: Record runner CPU
        shell: bash
        run: |
          uname -a || true
          lscpu 2>/dev/null | grep -iE "model name|vendor|bios" || true
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true

      - name: Compare wasmi-benchmarks
        env:
          BASELINE_SHA: ${{ needs.prepare.outputs.baseline }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate }}
          CATEGORY: ${{ matrix.category }}
          ENGINE: ${{ matrix.engine }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          status=0
          # PLACEMENT rows (--placement-metric below) cover the
          # per-binary layout class the certified floors cannot: their
          # swings track the image's address layout, not its code. The
          # list stays until a successor (layout jiggle or an
          # instruction-count lane) can prove a row's swing is layout.
          #
          # Linux-only jobs: the setarch personality is inherited by every
          # child, pinning the address layout of the bench processes that
          # cargo-criterion spawns.
          taskset -c 1 setarch "$(uname -m)" -R python3 -m ci.wasmi_performance \
            --suite wasmi-benchmarks \
            --suite-sha 16a3d7c8fdb05506c116a9451175732d1ac77099 \
            --baseline-source baseline \
            --candidate-source . \
            --baseline-sha "$BASELINE_SHA" \
            --candidate-sha "$CANDIDATE_SHA" \
            --platform "$PLATFORM" \
            --engine "$ENGINE" \
            --category "$CATEGORY" \
            --pilot-probability 80 \
            --regression-probability 99.99 \
            --improvement-probability 99.99 \
            --minimum-effect-percent 1.0 \
            --placement-metric execute/fibonacci-tail \
            --placement-metric execute/tiny_keccak \
            --placement-metric execute/json_parse \
            --placement-metric execute/mandelbrot \
            --family-jobs 4 \
            --family-metric-count 27 \
            --max-confirmation-runs 2 \
            --target-root wasmi-target \
            --out-dir "wasmi-output/${ENGINE}-${CATEGORY}" || status=$?
          if [[ -f "wasmi-output/${ENGINE}-${CATEGORY}/summary.md" ]]; then
            cat "wasmi-output/${ENGINE}-${CATEGORY}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          # A pure regression verdict is not final; the confirm job
          # re-measures on an independent runner and fails only what
          # reproduces there. Harness errors keep their exit status.
          if [[ "$status" -eq 1 ]]; then
            flagged=$(python3 -c "import json, os, pathlib; doc = pathlib.Path('wasmi-output') / (os.environ['ENGINE'] + '-' + os.environ['CATEGORY']) / 'comparison.json'; metrics = (json.loads(doc.read_text(encoding='utf-8')).get('metrics') or {}) if doc.is_file() else {}; print('true' if any(m.get('status') == 'REGRESSION' for m in metrics.values()) else 'false')")
            if [[ "$flagged" == "true" ]]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "> Regressions above are forwarded to cross-run confirmation." >> "$GITHUB_STEP_SUMMARY"
              status=0
            fi
          fi
          if [[ "$status" -ne 0 && "$GITHUB_REF" == refs/heads/dev/* ]]; then
            echo "::warning title=Dev wasmi performance soft-fail::Action required; see the job summary and artifact."
          fi
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wasmi-performance-${{ matrix.platform }}-${{ matrix.engine }}-${{ matrix.category }}
          path: wasmi-output/${{ matrix.engine }}-${{ matrix.category }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Mark dev soft-fail as action required
        if: failure() && startsWith(github.ref, 'refs/heads/dev/')
        run: |
          {
            echo
            echo "> [!CAUTION]"
            echo "> **SOFT-FAIL — ACTION REQUIRED.** Email is suppressed for"
            echo "> dev branches, but a preceding step failed. This is not a pass."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Dev CI soft-fail::Action required; this wasmi job did not pass."

  wasmi-confirm:
    name: wasmi-confirm / ${{ matrix.platform }} / ${{ matrix.engine }} / ${{ matrix.category }}
    needs: [prepare, wasmi]
    # Without this, one crashed primary cell skips the entire
    # confirmation layer and every other cell's flagged regressions go
    # unadjudicated while the run page stays green.
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    # Dev continue-on-error suppresses failure email only. A failure remains
    # action-required and is surfaced in the summary below.
    continue-on-error: ${{ startsWith(github.ref, 'refs/heads/dev/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64-linux
            runner: ubuntu-latest
            engine: jit
            category: execute
          - platform: x64-linux
            runner: ubuntu-latest
            engine: jit
            category: startup
          - platform: x64-linux
            runner: ubuntu-latest
            engine: interp
            category: execute
          - platform: x64-linux
            runner: ubuntu-latest
            engine: interp
            category: startup
          - platform: arm64-linux
            runner: ubuntu-24.04-arm
            engine: jit
            category: execute
          - platform: arm64-linux
            runner: ubuntu-24.04-arm
            engine: jit
            category: startup
          - platform: arm64-linux
            runner: ubuntu-24.04-arm
            engine: interp
            category: execute
          - platform: arm64-linux
            runner: ubuntu-24.04-arm
            engine: interp
            category: startup
    defaults:
      run:
        shell: bash
    steps:
      - name: Fetch the primary verdict
        # A primary cell that failed before measuring uploads no verdict;
        # a missing artifact means nothing to confirm here, and that
        # cell's own red job stays the visible signal.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: wasmi-performance-${{ matrix.platform }}-${{ matrix.engine }}-${{ matrix.category }}
          # Outside the workspace: the checkout below cleans the workspace
          # and would silently delete the downloaded verdict.
          path: ${{ runner.temp }}/primary

      - name: Decide whether confirmation is needed
        id: decide
        env:
          PRIMARY_DIR: ${{ runner.temp }}/primary
        run: |
          set -euo pipefail
          flagged=$(python3 -c "import json, os, pathlib; doc = pathlib.Path(os.environ['PRIMARY_DIR']) / 'comparison.json'; metrics = (json.loads(doc.read_text(encoding='utf-8')).get('metrics') or {}) if doc.is_file() else {}; print(' '.join(sorted(name for name, m in metrics.items() if m.get('status') == 'REGRESSION')))")
          if [[ -n "$flagged" ]]; then confirm=true; else confirm=false; fi
          echo "confirm=$confirm" >> "$GITHUB_OUTPUT"
          echo "flagged=$flagged" >> "$GITHUB_OUTPUT"
          echo "primary flagged rows: ${flagged:-none}"

      - name: Checkout candidate
        if: steps.decide.outputs.confirm == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.candidate }}

      - name: Checkout baseline
        if: steps.decide.outputs.confirm == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.baseline }}
          path: baseline

      - name: Checkout pinned wasmi-benchmarks
        if: steps.decide.outputs.confirm == 'true'
        uses: actions/checkout@v7
        with:
          repository: wasmi-labs/wasmi-benchmarks
          ref: 16a3d7c8fdb05506c116a9451175732d1ac77099
          path: wasmi-benchmarks
          submodules: recursive
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        if: steps.decide.outputs.confirm == 'true'
        id: rust-toolchain

      - name: Install wasmi benchmark system dependency
        if: steps.decide.outputs.confirm == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libfontconfig1-dev

      - name: Restore cargo-criterion
        if: steps.decide.outputs.confirm == 'true'
        id: cargo-criterion-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-criterion
          key: cargo-criterion-1.1.0-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.rust-toolchain.outputs.cachekey }}

      - name: Install pinned cargo-criterion
        if: steps.decide.outputs.confirm == 'true' && steps.cargo-criterion-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version 1.1.0 cargo-criterion

      - uses: Swatinem/rust-cache@v2.9.1
        if: steps.decide.outputs.confirm == 'true'
        with:
          shared-key: wasmi-${{ matrix.platform }}-${{ matrix.engine }}
          workspaces: ". -> wasmi-target"

      - name: Record runner CPU
        if: steps.decide.outputs.confirm == 'true'
        run: |
          uname -a || true
          lscpu 2>/dev/null | grep -iE "model name|vendor|bios" || true
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true

      - name: Re-measure the flagged rows on this runner
        if: steps.decide.outputs.confirm == 'true'
        env:
          BASELINE_SHA: ${{ needs.prepare.outputs.baseline }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate }}
          CATEGORY: ${{ matrix.category }}
          ENGINE: ${{ matrix.engine }}
          PLATFORM: ${{ matrix.platform }}
          FLAGGED: ${{ steps.decide.outputs.flagged }}
        run: |
          set -euo pipefail
          # The rows under test were pre-registered by the primary run, so
          # this is a single re-test per row on independent hardware: the
          # uncorrected gate probability with the same practical floor.
          # Only the flagged rows are re-measured, keeping this job well
          # inside the ten-minute budget.
          only_args=()
          for group in $FLAGGED; do
            only_args+=(--only "$group")
          done
          # Linux-only jobs: the setarch personality is inherited by every
          # child, pinning the address layout of the bench processes that
          # cargo-criterion spawns.
          taskset -c 1 setarch "$(uname -m)" -R python3 -m ci.wasmi_performance \
            --suite wasmi-benchmarks \
            --suite-sha 16a3d7c8fdb05506c116a9451175732d1ac77099 \
            --baseline-source baseline \
            --candidate-source . \
            --baseline-sha "$BASELINE_SHA" \
            --candidate-sha "$CANDIDATE_SHA" \
            --platform "$PLATFORM" \
            --engine "$ENGINE" \
            --category "$CATEGORY" \
            --pilot-probability 80 \
            --regression-probability 99 \
            --improvement-probability 99.99 \
            --minimum-effect-percent 1.0 \
            --placement-metric execute/fibonacci-tail \
            --placement-metric execute/tiny_keccak \
            --placement-metric execute/json_parse \
            --placement-metric execute/mandelbrot \
            --family-jobs 1 \
            --family-metric-count 27 \
            --max-confirmation-runs 2 \
            --target-root wasmi-target \
            "${only_args[@]}" \
            --out-dir "wasmi-output-confirm/${ENGINE}-${CATEGORY}" || true
          if [[ -f "wasmi-output-confirm/${ENGINE}-${CATEGORY}/summary.md" ]]; then
            cat "wasmi-output-confirm/${ENGINE}-${CATEGORY}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cross-run verdict
        if: steps.decide.outputs.confirm == 'true'
        env:
          CATEGORY: ${{ matrix.category }}
          ENGINE: ${{ matrix.engine }}
          PRIMARY_DIR: ${{ runner.temp }}/primary
        run: |
          set -euo pipefail
          status=0
          python3 -m ci.perf_confirm \
            --primary "${PRIMARY_DIR}/comparison.json" \
            --confirm "wasmi-output-confirm/${ENGINE}-${CATEGORY}/comparison.json" \
            --summary-out verdict.md || status=$?
          if [[ -f verdict.md ]]; then
            cat verdict.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: always() && steps.decide.outputs.confirm == 'true'
        with:
          name: wasmi-performance-confirm-${{ matrix.platform }}-${{ matrix.engine }}-${{ matrix.category }}
          path: wasmi-output-confirm/${{ matrix.engine }}-${{ matrix.category }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Mark dev soft-fail as action required
        if: failure() && startsWith(github.ref, 'refs/heads/dev/')
        run: |
          {
            echo
            echo "> [!CAUTION]"
            echo "> **SOFT-FAIL — ACTION REQUIRED.** Email is suppressed for"
            echo "> dev branches, but a preceding step failed. This is not a pass."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Dev CI soft-fail::Action required; this wasmi-confirm job did not pass."
