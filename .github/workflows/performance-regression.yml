name: performance-regression

on:
  pull_request:
  push:
    branches:
      - main
      - "dev/**"
  workflow_dispatch:
    inputs:
      baseline:
        description: "Baseline ref; empty means main merge-base (or HEAD^ on main)"
        required: false
        type: string
      calibration:
        description: "Compare two builds of the same commit to measure CI drift"
        required: true
        default: false
        type: boolean
      blocks:
        description: "Initial alternating blocks; each block has two paired samples"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  prepare:
    name: resolve refs and build dev branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Dev failures stay visible in logs but must not trigger failure email.
    # They are action-required soft failures, not successful validation.
    continue-on-error: ${{ startsWith(github.ref, 'refs/heads/dev/') }}
    outputs:
      baseline: ${{ steps.refs.outputs.baseline }}
      candidate: ${{ steps.refs.outputs.candidate }}
      blocks: ${{ steps.refs.outputs.blocks }}
      calibration: ${{ steps.refs.outputs.calibration }}
      matrix: ${{ steps.refs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve baseline and candidate
        id: refs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          INPUT_BASELINE: ${{ inputs.baseline }}
          INPUT_BLOCKS: ${{ inputs.blocks }}
          INPUT_CALIBRATION: ${{ inputs.calibration }}
        run: |
          set -euo pipefail
          candidate="$GITHUB_SHA"
          calibration="${INPUT_CALIBRATION:-false}"

          if [[ "$calibration" == "true" ]]; then
            baseline="$candidate"
          elif [[ -n "${INPUT_BASELINE:-}" ]]; then
            if baseline="$(git rev-parse "${INPUT_BASELINE}^{commit}" 2>/dev/null)"; then
              :
            else
              git fetch --quiet origin "$INPUT_BASELINE"
              baseline="$(git rev-parse "FETCH_HEAD^{commit}")"
            fi
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            baseline="$PR_BASE"
          elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            if [[ -n "${PUSH_BEFORE:-}" && \
                  "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
              baseline="$PUSH_BEFORE"
            else
              baseline="$(git rev-parse "${candidate}^")"
            fi
          else
            git fetch --quiet origin main
            baseline="$(git merge-base origin/main "$candidate")"
          fi

          blocks="${INPUT_BLOCKS:-2}"
          matrix="$(python3 - <<'PY'
          import json
          import os

          platforms = [
              {
                  "platform": "x64-linux",
                  "runner": "ubuntu-latest",
                  "target": "",
                  "runner_prefix": "",
                  "exe": "",
                  "dev": True,
              },
              {
                  "platform": "arm64-linux",
                  "runner": "ubuntu-24.04-arm",
                  "target": "",
                  "runner_prefix": "",
                  "exe": "",
                  "dev": True,
              },
              {
                  "platform": "arm64-darwin",
                  "runner": "macos-14",
                  "target": "",
                  "runner_prefix": "",
                  "exe": "",
                  "dev": True,
              },
              {
                  "platform": "x64-windows",
                  "runner": "windows-latest",
                  "target": "",
                  "runner_prefix": "",
                  "exe": ".exe",
                  "dev": True,
              },
              {
                  "platform": "cross-armv7-a",
                  "runner": "ubuntu-latest",
                  "target": "armv7-unknown-linux-musleabihf",
                  "runner_prefix": "qemu-arm-static -cpu cortex-a15",
                  "exe": "",
                  "dev": False,
              },
              {
                  "platform": "cross-riscv64",
                  "runner": "ubuntu-latest",
                  "target": "riscv64gc-unknown-linux-musl",
                  "runner_prefix": "qemu-riscv64-static",
                  "exe": "",
                  "dev": False,
              },
              {
                  "platform": "cross-riscv32",
                  "runner": "ubuntu-latest",
                  "target": "riscv32gc-unknown-linux-musl",
                  "runner_prefix": "qemu-riscv32-static",
                  "exe": "",
                  "dev": False,
              },
          ]
          dev_only = os.environ["GITHUB_REF"].startswith("refs/heads/dev/")
          include = []
          for platform in platforms:
              if dev_only and not platform["dev"]:
                  continue
              row = {key: value for key, value in platform.items() if key != "dev"}
              row["mode"] = (
                  "correctness"
                  if platform["runner_prefix"]
                  else "performance"
              )
              for engine in ("jit", "interp"):
                  include.append(dict(row, engine=engine))
          print(json.dumps({"include": include}, separators=(",", ":")))
          PY
          )"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "blocks=$blocks" >> "$GITHUB_OUTPUT"
          echo "calibration=$calibration" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "### Performance comparison"
            echo
            echo "- baseline: \`$baseline\`"
            echo "- candidate: \`$candidate\`"
            echo "- initial paired samples: \`$((blocks * 2))\`"
            echo "- order: \`ABAB / BABA\` alternating"
            echo "- targeted pair budget: \`6..24\`"
            echo "- pilot direction probability: \`80%\`"
            echo "- regression probability: \`99.99%\`"
            echo "- improvement probability: \`99.99%\`"
            echo "- model: \`paired log delta + adaptive Student-t confirmation\`"
            echo "- calibration: \`$calibration\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test CI implementation
        run: python3 -m unittest discover -s ci -p 'test_*.py'

      - name: Surface lint suppression debt
        id: lint-policy
        continue-on-error: true
        run: python3 -m ci.lint_policy

      - name: Mark lint suppression debt as action required
        if: steps.lint-policy.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Lint suppression audit"
            echo
            echo "> [!CAUTION]"
            echo "> **ACTION REQUIRED.** The repository contains unreviewed"
            echo "> Rust lint suppressions. Performance measurement continues"
            echo "> so correctness debt does not hide performance data; the"
            echo "> independent correctness workflow remains a hard failure."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Lint suppression audit::Unreviewed Rust lint suppressions are present; benchmark measurement will continue."

      - uses: dtolnay/rust-toolchain@1.97.0
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev/')

      - uses: Swatinem/rust-cache@v2.9.1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev/')
        with:
          shared-key: dev-build

      - name: cargo build (workspace)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev/')
        run: cargo build --workspace

      - name: Surface architecture-sensitive warnings
        id: warning-audit
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev/')
        continue-on-error: true
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          status=0

          audit() {
            local name="$1"
            shift
            local log
            local rc
            log="$(mktemp)"
            echo "::group::$name"
            "$@" 2>&1 | tee "$log"
            rc="${PIPESTATUS[0]}"
            echo "::endgroup::"
            if [[ "$rc" -ne 0 ]] || grep -qE '^warning(\[[^]]+\])?:' "$log"; then
              status=1
            fi
            rm -f "$log"
          }

          audit "release / default features" \
            cargo check --release -p sf-nano-core
          audit "release / JIT only" \
            cargo check --release -p sf-nano-core \
              --no-default-features --features jit
          audit "release / interpreter only" \
            cargo check --release -p sf-nano-core \
              --no-default-features --features interp

          if [[ "$status" -ne 0 ]]; then
            {
              echo "## Warning audit"
              echo
              echo "> [!CAUTION]"
              echo "> **ACTION REQUIRED.** One or more representative release"
              echo "> configurations emitted compiler warnings. The benchmark"
              echo "> will continue so correctness debt does not hide performance"
              echo "> data; inspect this step's three log groups."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Warning audit::Correctness warning debt is present; benchmark measurement will continue."
          fi

          exit "$status"

      - name: Mark dev soft-fail as action required
        if: failure() && startsWith(github.ref, 'refs/heads/dev/')
        run: |
          {
            echo "## Dev CI soft-fail"
            echo
            echo "> [!CAUTION]"
            echo "> **ACTION REQUIRED.** Email is suppressed for dev branches,"
            echo "> but a preceding step failed. This is not a passing result."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Dev CI soft-fail::Action required; this run did not pass."

  compare:
    name: ${{ matrix.platform }} / ${{ matrix.engine }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # See CLAUDE.md and AGENTS.md: this suppresses dev failure email only.
    # A failed dev job still requires correction.
    continue-on-error: ${{ startsWith(github.ref, 'refs/heads/dev/') }}
    strategy:
      fail-fast: false
      # prepare emits eight native rows for dev/** and fourteen rows for
      # PR, main, and workflow_dispatch. Explicit rows avoid matrix
      # include/exclude re-adding partial platform entries.
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/perf-target
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/perf-zig-cache
    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.candidate }}

      - name: Checkout baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.baseline }}
          path: baseline

      - uses: dtolnay/rust-toolchain@1.97.0
        if: matrix.target != 'riscv32gc-unknown-linux-musl'
        with:
          targets: ${{ matrix.target }}

      - uses: dtolnay/rust-toolchain@nightly
        if: matrix.target == 'riscv32gc-unknown-linux-musl'
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: perf-${{ matrix.platform }}-${{ matrix.engine }}
          workspaces: ". -> perf-target"

      - name: Install QEMU user-static
        if: matrix.runner_prefix != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static

      - name: Cache Zig
        if: matrix.target == 'riscv32gc-unknown-linux-musl'
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/zig/0.14.0/x86_64
          key: zig-0.14.0-linux-x64

      - name: Install Zig
        if: matrix.target == 'riscv32gc-unknown-linux-musl'
        run: bash ci/install_zig.sh

      - name: Build baseline and candidate
        env:
          ENGINE: ${{ matrix.engine }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          python3 -m ci.performance_build \
            --baseline-source baseline \
            --candidate-source . \
            --out-dir perf-bin \
            --engine "$ENGINE" \
            --platform "$PLATFORM" \
            --target "$TARGET" \
            --exe-suffix "$EXE" \
            --baseline-sha "${{ needs.prepare.outputs.baseline }}" \
            --candidate-sha "${{ needs.prepare.outputs.candidate }}"

      - name: Run benchmark suite
        env:
          BASELINE_SHA: ${{ needs.prepare.outputs.baseline }}
          CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate }}
          BLOCKS: ${{ needs.prepare.outputs.blocks }}
          ENGINE: ${{ matrix.engine }}
          PLATFORM: ${{ matrix.platform }}
          MODE: ${{ matrix.mode }}
          RUNNER_PREFIX: ${{ matrix.runner_prefix }}
          TARGET: ${{ matrix.target }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          args=(
            -m ci.performance
            --baseline-exec "perf-bin/baseline${EXE}"
            --candidate-exec "perf-bin/candidate${EXE}"
            --engine "$ENGINE"
            --platform "$PLATFORM"
            --baseline-sha "$BASELINE_SHA"
            --candidate-sha "$CANDIDATE_SHA"
            --build-metadata "perf-bin/build-metadata.json"
            --blocks "$BLOCKS"
            --min-pairs 6
            --max-pairs 24
            --pilot-probability 80
            --regression-probability 99.99
            --improvement-probability 99.99
            --out-dir "perf-output/${ENGINE}"
          )
          if [[ -n "$RUNNER_PREFIX" ]]; then
            args+=(--runner-prefix "$RUNNER_PREFIX")
          fi
          if [[ "$MODE" == "correctness" ]]; then
            args+=(--correctness-only)
          fi
          status=0
          python3 "${args[@]}" || status=$?
          if [[ -f "perf-output/${ENGINE}/summary.md" ]]; then
            cat "perf-output/${ENGINE}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$status" -ne 0 && "$GITHUB_REF" == refs/heads/dev/* ]]; then
            echo "::warning title=Dev performance soft-fail::Action required; see the job summary and artifact."
          fi
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-${{ matrix.platform }}-${{ matrix.engine }}
          path: |
            perf-output/${{ matrix.engine }}/
            perf-bin/build-metadata.json
          if-no-files-found: warn
          retention-days: 14

      - name: Mark dev soft-fail as action required
        if: failure() && startsWith(github.ref, 'refs/heads/dev/')
        run: |
          {
            echo
            echo "> [!CAUTION]"
            echo "> **SOFT-FAIL — ACTION REQUIRED.** Email is suppressed for"
            echo "> dev branches, but a preceding step failed. This is not a pass."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Dev CI soft-fail::Action required; this job did not pass."
