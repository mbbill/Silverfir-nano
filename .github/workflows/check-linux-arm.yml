name: check-linux-arm

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Cross-arch QEMU/RV32 runs are owned by check-linux.yml (the x64 job).
  # This arm64 Linux job validates native arm64 only; defer the rest.
  SF_CHECK_SKIP_CROSS_RUNTIME: "1"

jobs:
  check:
    name: full (arm64 native)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract testsuite SHA
        id: testsuite
        run: |
          sha=$(grep -E '^const TESTSUITE_VERSION:' sf-nano-spectest/build.rs | sed -E 's/.*"([0-9a-f]+)".*/\1/')
          if [ -z "$sha" ]; then echo "could not parse TESTSUITE_VERSION" >&2; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache WebAssembly testsuite
        uses: actions/cache@v4
        with:
          path: target/webassembly-testsuite
          key: testsuite-${{ steps.testsuite.outputs.sha }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          # Native arm64-linux + cross-check rows from check.py's default
          # target matrix (cargo check only) + bare-smoke targets.
          targets: aarch64-unknown-linux-gnu,x86_64-unknown-linux-gnu,aarch64-apple-darwin,x86_64-apple-darwin,x86_64-pc-windows-gnu,thumbv8m.main-none-eabihf,riscv32imac-unknown-none-elf

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Run check.py full
        # --default-targets keeps the cargo-check target matrix to the
        # host-friendly rows. The cross-arch rows (armv7/riscv64/riscv32) are
        # owned by check-linux.yml, where the qemu-user-static + Zig toolchain
        # is installed.
        run: python3 scripts/check.py full --install-targets --default-targets

      - name: Upload check logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-linux-arm-logs
          path: target/check-*-logs/
          if-no-files-found: ignore
          retention-days: 14
