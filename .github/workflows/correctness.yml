name: correctness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: correctness-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policy:
    name: formatting, warning policy, and CI unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt

      - name: Test CI implementation
        run: python3 -m unittest ci.test_correctness ci.test_lint_policy ci.test_performance

      - name: Enforce lint suppression policy
        run: python3 -m ci.lint_policy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  platform:
    name: ${{ matrix.platform }}
    needs: policy
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64-linux
            runner: ubuntu-latest
            timeout: 90
            python: python3
            suite: host x64-linux
            targets: x86_64-unknown-linux-gnu
            testsuite: true
            nightly: false
            qemu: false
            zig: false

          - platform: arm64-linux
            runner: ubuntu-24.04-arm
            timeout: 90
            python: python3
            suite: host arm64-linux
            targets: aarch64-unknown-linux-gnu
            testsuite: true
            nightly: false
            qemu: false
            zig: false

          - platform: arm64-darwin
            runner: macos-14
            timeout: 90
            python: python3
            suite: host arm64-darwin
            targets: aarch64-apple-darwin
            testsuite: true
            nightly: false
            qemu: false
            zig: false

          - platform: x64-windows
            runner: windows-latest
            timeout: 90
            python: python
            suite: host x64-windows
            targets: x86_64-pc-windows-msvc,x86_64-pc-windows-gnu
            testsuite: true
            nightly: false
            qemu: false
            zig: false

          - platform: armv7-linux
            runner: ubuntu-latest
            timeout: 60
            python: python3
            suite: cross armv7
            targets: armv7-unknown-linux-musleabihf
            testsuite: true
            nightly: false
            qemu: true
            zig: false

          - platform: riscv64-linux
            runner: ubuntu-latest
            timeout: 60
            python: python3
            suite: cross riscv64
            targets: riscv64gc-unknown-linux-musl
            testsuite: true
            nightly: false
            qemu: true
            zig: false

          - platform: riscv32-linux
            runner: ubuntu-latest
            timeout: 60
            python: python3
            suite: cross riscv32
            targets: x86_64-unknown-linux-gnu
            testsuite: true
            nightly: true
            qemu: true
            zig: true

          - platform: thumbv8m-bare
            runner: ubuntu-latest
            timeout: 20
            python: python3
            suite: bare thumbv8m
            targets: thumbv8m.main-none-eabihf
            testsuite: false
            nightly: false
            qemu: false
            zig: false

          - platform: riscv32-bare
            runner: ubuntu-latest
            timeout: 20
            python: python3
            suite: bare riscv32
            targets: riscv32imac-unknown-none-elf
            testsuite: false
            nightly: false
            qemu: false
            zig: false

    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7

      - name: Extract testsuite revision
        if: matrix.testsuite
        id: testsuite
        shell: bash
        run: |
          sha=$(grep -E '^const TESTSUITE_VERSION:' sf-nano-spectest/build.rs | sed -E 's/.*"([0-9a-f]+)".*/\1/')
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache WebAssembly testsuite
        if: matrix.testsuite
        uses: actions/cache@v6
        with:
          path: target/webassembly-testsuite
          key: testsuite-${{ steps.testsuite.outputs.sha }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.targets }}

      - name: Install nightly Rust and rust-src
        if: matrix.nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: correctness-${{ matrix.platform }}

      - name: Install QEMU user-mode emulators
        if: matrix.qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static

      - name: Cache Zig
        if: matrix.zig
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/zig/0.14.0/x86_64
          key: zig-0.14.0-linux-x64

      - name: Install Zig
        if: matrix.zig
        run: bash ci/install_zig.sh

      - name: Run platform correctness
        run: ${{ matrix.python }} -m ci.correctness ${{ matrix.suite }}

      - name: Upload correctness logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: correctness-${{ matrix.platform }}-logs
          path: target/ci-logs/
          if-no-files-found: ignore
          retention-days: 14
