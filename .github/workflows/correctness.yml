name: correctness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: correctness-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  policy:
    name: formatting, warning policy, and CI unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Test CI implementation
        if: ${{ always() && !cancelled() }}
        run: python3 -m unittest discover -s ci -p 'test_*.py'

      - name: Enforce lint suppression policy
        if: ${{ always() && !cancelled() }}
        run: python3 -m ci.lint_policy

      - name: Check Rust formatting
        if: ${{ always() && !cancelled() }}
        run: cargo fmt --all -- --check

  miri:
    name: Miri instance-table token discipline
    needs: policy
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    # Budget covers a cold Miri sysroot build plus one compile per aliasing
    # model; a warm rust-cache finishes in a fraction of this.
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: correctness-miri

      - name: Set up Miri sysroot
        run: cargo +nightly miri setup

      # `--exact` on a name that no longer exists prints "running 0 tests"
      # and exits 0, so a rename would turn these steps green while checking
      # nothing. Assert the test actually ran.
      - name: Check scoped materialization under Stacked Borrows
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: |
          set -o pipefail
          cargo +nightly miri test \
            -p sf-nano-core \
            --no-default-features \
            --features jit,interp \
            --lib \
            vm::link::instance_table_tests::miri_instance_table_scopes_materializations \
            -- --exact --nocapture | tee miri-sb.log
          grep -q '^test result: ok\. 1 passed' miri-sb.log

      - name: Check scoped materialization under Tree Borrows
        env:
          # Both aliasing models AND provenance. Replacing MIRIFLAGS wholesale
          # would silently drop strict provenance from this run.
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-strict-provenance
        run: |
          set -o pipefail
          cargo +nightly miri test \
            -p sf-nano-core \
            --no-default-features \
            --features jit,interp \
            --lib \
            vm::link::instance_table_tests::miri_instance_table_scopes_materializations \
            -- --exact --nocapture | tee miri-tb.log
          grep -q '^test result: ok\. 1 passed' miri-tb.log

  platform:
    name: ${{ matrix.platform }}
    needs: policy
    if: ${{ always() && !cancelled() }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64-linux
            runner: ubuntu-latest
            timeout: 90
            python: python3
            suite: host x64-linux
            targets: x86_64-unknown-linux-gnu
            testsuite: true
            nightly: false
            qemu: false
            zig: false

          - platform: arm64-linux
            runner: ubuntu-24.04-arm
            timeout: 90
            python: python3
            suite: host arm64-linux
            targets: aarch64-unknown-linux-gnu
            testsuite: true
            nightly: false
            qemu: false
            zig: false

          - platform: arm64-darwin
            runner: macos-14
            timeout: 90
            python: python3
            suite: host arm64-darwin
            targets: aarch64-apple-darwin
            testsuite: true
            nightly: false
            qemu: false
            zig: false

          - platform: x64-windows
            runner: windows-latest
            timeout: 90
            python: python
            suite: host x64-windows
            targets: x86_64-pc-windows-msvc
            testsuite: true
            nightly: false
            qemu: false
            zig: false

          - platform: cross-armv7-linux
            runner: ubuntu-latest
            timeout: 60
            python: python3
            suite: cross armv7
            targets: armv7-unknown-linux-musleabihf
            testsuite: true
            nightly: false
            qemu: true
            zig: false

          - platform: cross-riscv64-linux
            runner: ubuntu-latest
            timeout: 60
            python: python3
            suite: cross riscv64
            targets: riscv64gc-unknown-linux-musl
            testsuite: true
            nightly: false
            qemu: true
            zig: false

          - platform: cross-riscv32-linux
            runner: ubuntu-latest
            timeout: 60
            python: python3
            suite: cross riscv32
            targets: x86_64-unknown-linux-gnu
            testsuite: true
            nightly: true
            qemu: true
            zig: true

          - platform: thumbv8m-bare
            runner: ubuntu-latest
            timeout: 20
            python: python3
            suite: bare thumbv8m
            targets: thumbv8m.main-none-eabihf
            testsuite: false
            nightly: false
            qemu: false
            zig: false

          - platform: riscv32-bare
            runner: ubuntu-latest
            timeout: 20
            python: python3
            suite: bare riscv32
            targets: riscv32imac-unknown-none-elf
            testsuite: false
            nightly: false
            qemu: false
            zig: false

    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7

      - name: Extract testsuite revision
        if: matrix.testsuite
        id: testsuite
        shell: bash
        run: |
          sha=$(grep -E '^const TESTSUITE_VERSION:' sf-nano-spectest/build.rs | sed -E 's/.*"([0-9a-f]+)".*/\1/')
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Cache WebAssembly testsuite
        if: matrix.testsuite
        uses: actions/cache@v6
        with:
          path: target/webassembly-testsuite
          key: testsuite-${{ steps.testsuite.outputs.sha }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install nightly Rust and rust-src
        if: matrix.nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: correctness-${{ matrix.platform }}

      - name: Install QEMU user-mode emulators
        if: matrix.qemu
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static

      - name: Cache Zig
        if: matrix.zig
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/zig/0.14.0/x86_64
          key: zig-0.14.0-linux-x64

      - name: Install Zig
        if: matrix.zig
        run: bash ci/install_zig.sh

      - name: Run platform correctness
        run: ${{ matrix.python }} -m ci.correctness ${{ matrix.suite }}

      - name: Upload correctness logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: correctness-${{ matrix.platform }}-logs
          path: target/ci-logs/
          if-no-files-found: ignore
          retention-days: 14
