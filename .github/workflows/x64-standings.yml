# One-time anchor for the requested wasmi CoreMark module.
name: x64-coremark-anchor
on:
  push:
    branches: ["codex/x64-profiling"]
    paths: [".github/workflows/x64-standings.yml"]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  coremark:
    name: wasmi CoreMark anchor / draw ${{ matrix.draw }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        draw: [1, 2]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/wasmi-target
      BENCH_FEATURES: silverfir-nano-jit,wasmtime-cranelift,v8
    steps:
      - uses: actions/checkout@v7
      - name: Audit repository
        run: python3 -m ci.lint_policy
      - uses: actions/checkout@v7
        with:
          repository: wasmi-labs/wasmi-benchmarks
          ref: 16a3d7c8fdb05506c116a9451175732d1ac77099
          path: wasmi-benchmarks
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install suite system dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: x64-standings
          workspaces: "wasmi-benchmarks -> ../wasmi-target"
      - name: Pin suite resolution and local Nano source
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          suite = Path('wasmi-benchmarks')
          config = suite / '.cargo/config.toml'
          config.parent.mkdir(parents=True, exist_ok=True)
          config.write_text(
              '[patch."https://github.com/mbbill/Silverfir-nano"]\n'
              'sf-nano-core = { path = %s }\n' % json.dumps(str(Path('sf-nano-core').resolve())))
          (suite / 'Cargo.lock').write_bytes(Path('docs/performance-baseline-2026-09-06/corpus-Cargo.lock').read_bytes())
          PY
          cd wasmi-benchmarks
          cargo tree --locked -p rt-silverfir-nano | tee ../coremark-tree.txt
          grep -F "(${GITHUB_WORKSPACE}/sf-nano-core)" ../coremark-tree.txt
      - name: Build the three engines before timing
        working-directory: wasmi-benchmarks
        run: |
          set -euo pipefail
          cargo build --release --locked --no-default-features --features "$BENCH_FEATURES" \
            --bin coremark 2>&1 | tee ../coremark-build.log
          if rg '^warning:' ../coremark-build.log; then
            echo '::error::ACTION REQUIRED: compiler warnings'
            exit 1
          fi
      - name: Run exact wasmi CoreMark
        run: |
          mkdir coremark-out
          lscpu > coremark-out/cpu.txt
          rustc --version > coremark-out/rustc.txt
          git rev-parse HEAD > coremark-out/source.txt
          sha256sum wasmi-benchmarks/res/wasm/coremark.wasm > coremark-out/wasm-sha256.txt
          cd wasmi-benchmarks
          taskset -c 1 setarch "$(uname -m)" -R ../wasmi-target/release/coremark | tee ../coremark-out/run.log
      - name: Require all three valid scores
        run: |
          python3 - <<'PY'
          import json, math, os
          from pathlib import Path
          log = Path('coremark-out/run.log').read_text()
          scores = json.loads(log.split('Scores Summary (JSON):', 1)[1])
          assert set(scores) == {'silverfir-nano.jit', 'wasmtime.cranelift', 'v8'}, scores
          assert all(isinstance(x, (float, int)) and math.isfinite(x) and x > 0 for x in scores.values()), scores
          nano = scores['silverfir-nano.jit']
          output = {'scores': scores, 'competitor_over_nano': {k: v/nano for k, v in scores.items()}}
          Path('coremark-out/scores.json').write_text(json.dumps(output, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## wasmi CoreMark anchor\n\n| Engine | Score | Throughput / Nano |\n|---|---:|---:|\n')
              for engine, score in scores.items():
                  summary.write(f'| {engine} | {score:.2f} | {score/nano:.4f} |\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wasmi-coremark-anchor-${{ matrix.draw }}
          path: |
            coremark-out/
            coremark-build.log
            coremark-tree.txt
          if-no-files-found: error
          retention-days: 30
