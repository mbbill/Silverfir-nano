[package]
name = "waveshare-esp32-c6"
version = "0.1.0"
edition = "2021"
authors = ["Bill Ming <mbbill@gmail.com>"]
description = "Rust no_std bring-up firmware for the Waveshare ESP32-C6-LCD-1.47 board"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.88"
default-run = "waveshare-esp32-c6"
build = "build.rs"

# Standalone crate: keep ESP embedded dependencies out of the main workspace.
[workspace]

[dependencies]
embedded-alloc = "0.7"
embedded-graphics = "0.8"
embedded-hal = "1.0"
esp-backtrace = { version = "0.19.0", features = ["esp32c6", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6"] }
esp-hal = { version = "1.0.0", features = ["esp32c6", "unstable"] }
esp-println = { version = "0.17.0", default-features = false, features = [
    "esp32c6",
    "jtag-serial",
    "critical-section",
] }
sf-nano-core = { path = "../../sf-nano-core", default-features = false, features = ["jit"], optional = true }

[features]
default = ["mode-wasm", "demo-mandelbrot"]
demo-cube = []
demo-mandelbrot = []
mode-native = []
mode-wasm = ["dep:sf-nano-core"]

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 1
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false
