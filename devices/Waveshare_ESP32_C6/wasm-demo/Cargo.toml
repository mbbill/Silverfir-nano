[package]
name = "waveshare-esp32-c6-wasm-demo"
version = "0.1.0"
edition = "2021"
authors = ["Bill Ming <mbbill@gmail.com>"]
description = "Selected Waveshare ESP32-C6 render demo compiled to wasm32-unknown-unknown"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = ["demo-mandelbrot"]
demo-cube = []
demo-mandelbrot = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false
