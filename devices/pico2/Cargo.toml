[package]
name = "sf-nano-pico2"
version = "0.1.0"
edition = "2021"
authors = ["Bill Ming <mbbill@gmail.com>"]
description = "Silverfir-nano bring-up firmware for Raspberry Pi Pico 2 / Pico 2 W (RP2350)"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.82"
default-run = "mandelbrot_wasm"

# Standalone crate: keeps its own Cargo.lock, dep graph, and target config.
# Not a member of the main Silverfir-nano workspace — embedded deps stay out
# of hosted builds.
[workspace]

# Auto-discovered binaries live in `src/bin/`:
#   - heartbeat          : minimal bring-up, 1 Hz tick log over RTT
#   - lcd_demo           : SPI + DMA framebuffer pipeline, gradient + fps
#   - mandelbrot_native  : CPU-only Mandelbrot (performance ceiling)
#   - mandelbrot_wasm    : same kernel, JIT-executed — the headline demo

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
embedded-alloc = "0.7"
embedded-graphics = "0.8"
embedded-hal = "1.0"
embedded-hal-bus = "0.3"
mipidsi = "0.10"
panic-probe = { version = "0.3", features = ["print-defmt"] }
rp235x-hal = { version = "0.4", features = [
    "binary-info",
    "critical-section-impl",
    "rt",
    "defmt",
] }

# Silverfir JIT core. `default-features = false` drops guard-pages
# (std-requiring) and leaves just the bare JIT. Matches the dep spec
# in sf-nano-bare-smoke/, which is this crate's no-std link reference.
sf-nano-core = { path = "../../sf-nano-core", default-features = false, features = ["jit"] }


# Debug builds stay compact enough to flash quickly while still carrying
# symbols for probe-rs / defmt. opt-level = 1 keeps RTT timing sane without
# full release-level inlining.
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 1
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
# `opt-level = 3` prioritizes speed over code size. Flash headroom on
# Pico 2 W is plentiful (~3 MiB of 4 MiB free even with opt=3), so we
# take the larger-but-faster code. If a future size constraint bites,
# flip to "s" — expect the Mandelbrot compute path to slow by ~20-30%.
opt-level = 3
overflow-checks = false
