[package]
name = "sf-nano-pico2"
version = "0.1.0"
edition = "2021"
authors = ["Bill Ming <mbbill@gmail.com>"]
description = "Silverfir-nano bring-up firmware for Raspberry Pi Pico 2 / Pico 2 W (RP2350)"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.82"
default-run = "mandelbrot_wasm"

# Standalone crate: keeps its own Cargo.lock, dep graph, and target config.
# Not a member of the main Silverfir-nano workspace — embedded deps stay out
# of hosted builds.
[workspace]

# Auto-discovered binaries live in `src/bin/`:
#   - mandelbrot_native  : CPU-only Mandelbrot (performance ceiling)
#   - mandelbrot_wasm    : same kernel, JIT-executed — the headline demo
#
# Both bins compile for both supported targets (Cortex-M33 ARM and Hazard3
# RV32IMAC). Toggle with `cargo arm-run` / `cargo rv-run` (aliases in
# `.cargo/config.toml`).

[dependencies]
defmt = "0.3"
defmt-rtt = "0.4"
embedded-alloc = "0.7"
embedded-graphics = "0.8"
embedded-hal = "1.0"
embedded-hal-bus = "0.3"

# Silverfir JIT core. `default-features = false` drops guard-pages
# (std-requiring) and leaves just the bare JIT. Matches the dep spec
# in sf-nano-bare-smoke/, which is this crate's no-std link reference.
sf-nano-core = { path = "../../sf-nano-core", default-features = false, features = ["jit"] }

# rp235x-hal supports both ARM and RV modes via target-specific deps it
# carries internally (cortex-m / cortex-m-rt on thumbv8m, riscv / riscv-rt
# on riscv32imac). Same crate, same version, same feature set.
rp235x-hal = { version = "0.4", features = [
    "binary-info",
    "critical-section-impl",
    "rt",
    "defmt",
] }

# ARM-only runtime crate. Only pulled in when `target_arch = "arm"`.
# `panic-probe` (defmt-aware panic handler that breakpoints under probe-rs)
# is Cortex-M only — for RV32 builds, the panic handler is hand-rolled in
# `src/arch/rv.rs` and uses defmt + `ebreak`.
[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-probe = { version = "0.3", features = ["print-defmt"] }

# RV32-only runtime crate. The `riscv` crate version follows what
# rp235x-hal pins (0.11 in 0.4.0); riscv-rt follows similarly (0.12).
[target.'cfg(target_arch = "riscv32")'.dependencies]
riscv = "0.11"
riscv-rt = "0.12"


# Debug builds stay compact enough to flash quickly while still carrying
# symbols for probe-rs / defmt. opt-level = 1 keeps RTT timing sane without
# full release-level inlining.
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 1
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
# `opt-level = 3` prioritizes speed over code size. Flash headroom on
# Pico 2 W is plentiful (~3 MiB of 4 MiB free even with opt=3), so we
# take the larger-but-faster code. If a future size constraint bites,
# flip to "s" — expect the Mandelbrot compute path to slow by ~20-30%.
opt-level = 3
overflow-checks = false
