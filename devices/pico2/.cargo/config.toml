# Cargo configuration for the Pico 2 / Pico 2 W firmware.
#
# RP2350 boots either as 2× Cortex-M33 (ARM) or 2× Hazard3 (RV32IMAC).
# Same chip, same memory map, same peripherals; the boot ROM picks which
# core set runs based on the IMAGE_DEF block in flash. We support both
# from a single firmware crate via per-target deps in Cargo.toml and the
# `[target.<triple>]` blocks below.
#
# Toggle with the aliases:
#   cargo arm-run     — flash & run the ARM/Cortex-M33 build
#   cargo rv-run      — flash & run the RV32/Hazard3 build
#   cargo arm-build   — release build only, ARM target
#   cargo rv-build    — release build only, RV target
#
# Or pass `--target …` explicitly. There is intentionally no `[build] target`
# pin so neither arch is privileged.
#
# Runner: probe-rs flashes the ELF over SWD via the debugprobe-firmware
# Pico-1 attached to the target, then attaches to RTT and streams defmt.
# The chip name `RP235x` is the same for both core types — probe-rs
# selects the active boot core automatically.

[env]
# defmt filters log levels at compile time via this env var. Without it
# set, all `defmt::info!` / `error!` / etc. macros compile to no-ops and
# the RTT buffer stays empty, so `probe-rs run` sees nothing. `trace`
# enables every level; tighten later if build noise becomes an issue.
DEFMT_LOG = "trace"

[alias]
arm-run   = "run   --target thumbv8m.main-none-eabihf"
rv-run    = "run   --target riscv32imac-unknown-none-elf"
arm-build = "build --target thumbv8m.main-none-eabihf"
rv-build  = "build --target riscv32imac-unknown-none-elf"

# ── ARM / Cortex-M33 ─────────────────────────────────────────────────────
#
# --nmagic:      turn off page alignment; saves flash.
# -Tlink.x:      cortex-m-rt's master linker script (pulls in memory.x).
# -Tdefmt.x:     defmt section layout, required by defmt-rtt.
# -target-cpu:   tell LLVM to emit M33 instructions (DSP, optional CRC,
#                MVE not used here but available).
# -linker=flip-link: swap stack placement so overflow faults instead of
#                silently corrupting BSS. Critical on MCU where our
#                .bss holds a 320-KiB heap + 128-KiB code arena just
#                below the default stack-top; without flip-link a
#                stack overflow would scribble onto those.
[target.thumbv8m.main-none-eabihf]
rustflags = [
    "-C", "linker=flip-link",
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
    "-C", "target-cpu=cortex-m33",
]
runner = "probe-rs run --chip RP235x --protocol swd"

# ── RV32 / Hazard3 ───────────────────────────────────────────────────────
#
# Hazard3 is RV32IMAC + Zba/Zbb/Zbs/Zcmp/Zicsr/Zifencei. No F/D extension.
# The base `riscv32imac-unknown-none-elf` triple covers IMAC; the Zb*
# extensions can be enabled later via `target-feature` once we confirm
# rust+LLVM accept them on this triple.
#
# `link.x` and `defmt.x` here resolve to riscv-rt's linker scripts (the
# `Tlink.x` flag is the same; the file content differs per rt crate).
#
# Unlike cortex-m-rt, riscv-rt's `link.x` does NOT auto-include memory.x
# or device.x — both must be passed explicitly, BEFORE `-Tlink.x`:
#   memory.x — our MEMORY block + REGION_ALIAS for REGION_TEXT etc.
#   device.x — rp235x-pac's per-IRQ `PROVIDE(NAME = DefaultHandler)`
#              fragment, so all RP2350 vector entries default to the
#              riscv-rt DefaultHandler instead of failing to link.
[target.riscv32imac-unknown-none-elf]
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tmemory.x",
    "-C", "link-arg=-Tdevice.x",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
]
runner = "probe-rs run --chip RP235x --protocol swd"
