# Cargo configuration for the Pico 2 / Pico 2 W firmware.
#
# RP2350 boots either as two Cortex-M33 cores or two Hazard3 RV32IMAC
# cores. Same chip, same memory map, same peripherals; the boot ROM picks
# which core set runs based on the IMAGE_DEF block in flash.
#
# Toggle with the aliases:
#   cargo arm-run
#   cargo rv-run
#   cargo arm-build
#   cargo rv-build
#
# Runner note: probe-rs 0.31.0 can flash RV32 images over the SWD-facing
# M33 debug path, but the bundled RP235x chip metadata exposes only the
# M33 cores. After reset into Hazard3 mode, RTT/debug attach is therefore
# not available through this runner.

[env]
# defmt filters log levels at compile time via this env var. Without it
# set, defmt::info/error macros compile to no-ops and RTT stays empty.
DEFMT_LOG = "trace"

[alias]
arm-run   = "run   --target thumbv8m.main-none-eabihf"
rv-run    = "run   --target riscv32imac-unknown-none-elf"
arm-build = "build --target thumbv8m.main-none-eabihf"
rv-build  = "build --target riscv32imac-unknown-none-elf"

# ARM / Cortex-M33
#
# --nmagic:    turn off page alignment; saves flash.
# -Tlink.x:    cortex-m-rt's master linker script, which pulls memory.x.
# -Tdefmt.x:   defmt section layout, required by defmt-rtt.
# target-cpu:  ask LLVM for Cortex-M33 codegen.
# flip-link:   place the stack so overflow faults instead of corrupting BSS.
[target.thumbv8m.main-none-eabihf]
rustflags = [
    "-C", "linker=flip-link",
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
    "-C", "target-cpu=cortex-m33",
]
runner = "probe-rs run --chip RP235x --protocol swd"

# RV32 / Hazard3
#
# Hazard3 is RV32IMAC plus optional bit-manipulation extensions. The base
# riscv32imac-unknown-none-elf target is enough for first bring-up.
#
# memory.x is a standalone RP2350 RISC-V linker script based on the
# upstream rp235x-hal examples. It replaces riscv-rt's link.x so reset
# code starts at flash origin and IMAGE_DEF is embedded inside .text,
# which is the known-good Pico 2 RISC-V boot layout. defmt.x is still
# supplied separately for defmt-rtt.
[target.riscv32imac-unknown-none-elf]
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-Tmemory.x",
    "-C", "link-arg=-Tdefmt.x",
]
runner = "probe-rs run --chip RP235x --protocol swd"
