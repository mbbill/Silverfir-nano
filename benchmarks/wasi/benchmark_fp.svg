<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 700 354" width="700" height="354">
  <title>Floating-Point Benchmarks — WebAssembly Runtimes</title>
  <defs>
    <linearGradient id="hlGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="700" height="354" rx="8" ry="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="350.0" y="32" text-anchor="middle" fill="#1f2328" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="600">Floating-Point Benchmarks — WebAssembly Runtimes</text>
  <text x="350.0" y="51" text-anchor="middle" fill="#656d76" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12">Apple M4  ·  longer bar = better (lower time)  ·  bars inverted</text>
  <rect x="150.0" y="64" width="12" height="12" rx="2" fill="url(#hlGrad)"/>
  <text x="167.0" y="74" fill="#581c87" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11">Silverfir (micro-JIT)</text>
  <rect x="305.0" y="64" width="12" height="12" rx="2" fill="#e8873d" opacity="0.85"/>
  <text x="322.0" y="74" fill="#bf6a1f" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11">Cranelift (wasmtime)</text>
  <rect x="460.0" y="64" width="12" height="12" rx="2" fill="#4a9ede" opacity="0.85"/>
  <text x="477.0" y="74" fill="#2b7cbf" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11">V8 (Node.js 25.4)</text>
  <line x1="175" y1="84" x2="175" y2="342" stroke="#d0d7de" stroke-width="1"/>

  <text x="168" y="104.0" text-anchor="end" fill="#656d76" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">mandelbrot</text>
  <text x="182" y="104.0" fill="#8b949e" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">ms</text>
  <rect x="4" y="112" width="692" height="32" rx="4" fill="#f3e8ff" opacity="0.5"/>
  <text x="168" y="132.5" text-anchor="end" fill="#581c87" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">Silverfir</text>
  <rect x="175" y="114" width="355.6" height="28" rx="4" fill="url(#hlGrad)" filter="url(#glow)"><animate attributeName="width" from="0" to="355.6" dur="0.35s" fill="freeze"/></rect>
  <text x="522.6" y="133.0" text-anchor="end" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">1,178</text>
  <text x="168" y="163.5" text-anchor="end" fill="#1f2328" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400">Cranelift</text>
  <rect x="175" y="145" width="490.0" height="28" rx="4" fill="#e8873d" opacity="0.85"><animate attributeName="width" from="0" to="490.0" dur="0.39s" fill="freeze"/></rect>
  <text x="657.0" y="164.0" text-anchor="end" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">855</text>
  <text x="168" y="194.5" text-anchor="end" fill="#1f2328" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400">V8</text>
  <rect x="175" y="176" width="205.9" height="28" rx="4" fill="#4a9ede" opacity="0.85"><animate attributeName="width" from="0" to="205.9" dur="0.43s" fill="freeze"/></rect>
  <text x="372.9" y="195.0" text-anchor="end" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">2,035</text>

  <line x1="20" y1="214" x2="680" y2="214" stroke="#eaeef2" stroke-width="1"/>
  <text x="168" y="234.0" text-anchor="end" fill="#656d76" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600">c-ray (4K)</text>
  <text x="182" y="234.0" fill="#8b949e" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">ms</text>
  <rect x="4" y="242" width="692" height="32" rx="4" fill="#f3e8ff" opacity="0.5"/>
  <text x="168" y="262.5" text-anchor="end" fill="#581c87" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">Silverfir</text>
  <rect x="175" y="244" width="227.6" height="28" rx="4" fill="url(#hlGrad)" filter="url(#glow)"><animate attributeName="width" from="0" to="227.6" dur="0.39s" fill="freeze"/></rect>
  <text x="394.6" y="263.0" text-anchor="end" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">4,191</text>
  <text x="168" y="293.5" text-anchor="end" fill="#1f2328" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400">Cranelift</text>
  <rect x="175" y="275" width="464.2" height="28" rx="4" fill="#e8873d" opacity="0.85"><animate attributeName="width" from="0" to="464.2" dur="0.43s" fill="freeze"/></rect>
  <text x="631.2" y="294.0" text-anchor="end" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">2,055</text>
  <text x="168" y="324.5" text-anchor="end" fill="#1f2328" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400">V8</text>
  <rect x="175" y="306" width="490.0" height="28" rx="4" fill="#4a9ede" opacity="0.85"><animate attributeName="width" from="0" to="490.0" dur="0.47s" fill="freeze"/></rect>
  <text x="657.0" y="325.0" text-anchor="end" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">1,947</text>
</svg>
