[package]
name = "sf-nano-cli"
version = "0.1.0"
edition = "2021"
authors = ["Bill Ming <mbbill@gmail.com>"]
description = "Command-line WebAssembly runner using sf-nano-core"
license = "MIT/Apache-2.0"

[[bin]]
name = "sf-nano-cli"
path = "src/main.rs"

[features]
# Engine selection is the CLI's own: the core dependency takes
# `default-features = false`, so these features are what decide which engines
# are compiled in rather than decorating a core that already had both.
default = ["jit", "interp"]
jit = ["sf-nano-core/jit", "sf-nano-core/guard-pages"]
interp = ["sf-nano-core/interp"]
# This is a CLI capability, not a pass-through: it installs the tracked
# global allocator and adds the HTML report writer below. Core-only
# diagnostics are selected as `sf-nano-core/<feature>` at the Cargo CLI.
memprof = ["sf-nano-core/memprof", "dep:tracked_alloc", "dep:memprof_report"]

[dependencies]
sf-nano-core = { path = "../sf-nano-core", default-features = false, features = [
    "wasi",
] }
tracked_alloc = { package = "sf-nano-tracked-alloc", path = "../tools/tracked-alloc", features = ["memprof"], optional = true }
memprof_report = { package = "sf-nano-memprof-report", path = "../tools/memprof-report", optional = true }
