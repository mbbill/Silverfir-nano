  <text class="val" x="571.9" y="253">9,488</text>
  <text class="metric" x="168" y="286" text-anchor="end">STREAM Add</text>
  <text class="unit" x="176" y="286">MB/s</text>
  <text class="name" x="168" y="309" text-anchor="end">Silverfir (interp)</text>
  <rect class="s-si" x="176" y="296" width="452.0" height="18" rx="4"/>
  <text class="val" x="634.0" y="309">12,076</text>
  <text class="name" x="168" y="329" text-anchor="end">wasm3</text>
  <rect class="s-w3" x="176" y="316" width="253.3" height="18" rx="4"/>
  <text class="val" x="435.3" y="329">6,767</text>
  <text class="name" x="168" y="349" text-anchor="end">wasmi 2.0.0</text>
  <rect class="s-wi" x="176" y="336" width="338.7" height="18" rx="4"/>
  <text class="val" x="520.7" y="349">9,048</text>
  <text class="metric" x="168" y="382" text-anchor="end">STREAM Triad</text>
  <text class="unit" x="176" y="382">MB/s</text>
  <text class="name" x="168" y="405" text-anchor="end">Silverfir (interp)</text>
  <rect class="s-si" x="176" y="392" width="452.0" height="18" rx="4"/>
  <text class="val" x="634.0" y="405">10,898</text>
