  <text class="val" x="634.0" y="157">165,092</text>
  <text class="metric" x="168" y="190" text-anchor="end">STREAM Scale</text>
  <text class="unit" x="176" y="190">MB/s</text>
  <text class="name" x="168" y="213" text-anchor="end">Silverfir (interp)</text>
