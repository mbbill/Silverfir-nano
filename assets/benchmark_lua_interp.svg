  <text class="val" x="528.7" y="157">320.2</text>
  <text class="metric" x="168" y="190" text-anchor="end">lua / sunfish</text>
  <text class="unit" x="176" y="190">score</text>
  <text class="name" x="168" y="213" text-anchor="end">Silverfir (interp)</text>
  <rect class="s-si" x="176" y="200" width="452.0" height="18" rx="4"/>
  <text class="val" x="634.0" y="213">1,750</text>
  <text class="name" x="168" y="233" text-anchor="end">wasm3</text>
  <rect class="s-w3" x="176" y="220" width="249.4" height="18" rx="4"/>
  <text class="val" x="431.4" y="233">965.5</text>
  <text class="name" x="168" y="253" text-anchor="end">wasmi 2.0.0</text>
