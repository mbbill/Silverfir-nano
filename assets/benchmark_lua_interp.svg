  <text class="unit" x="176" y="286">score</text>
  <text class="name" x="168" y="309" text-anchor="end">Silverfir (interp)</text>
  <rect class="s-si" x="176" y="296" width="452.0" height="18" rx="4"/>
  <text class="val" x="634.0" y="309">3,514</text>
  <text class="name" x="168" y="329" text-anchor="end">wasm3</text>
  <rect class="s-w3" x="176" y="316" width="244.5" height="18" rx="4"/>
  <text class="val" x="426.5" y="329">1,901</text>
  <text class="name" x="168" y="349" text-anchor="end">wasmi 2.0.0</text>
  <rect class="s-wi" x="176" y="336" width="336.6" height="18" rx="4"/>
  <text class="val" x="518.6" y="349">2,617</text>
</svg>
