  <text class="title" x="380" y="30" text-anchor="middle">Memory-Bound Benchmarks (STREAM) — Compiled</text>
  <text class="sub" x="380" y="47" text-anchor="middle">Intel Core i9-14900K · longer bar = better · each row scaled to its own best</text>
