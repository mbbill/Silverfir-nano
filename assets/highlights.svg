<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 700 308" width="700" height="308">
  <title>Silverfir-nano — strong on every axis: fast, small, portable, full Wasm 3.0, on-device JIT</title>
  <style>
    text     { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .surface { fill: #fcfcfb; stroke: #d8d8d4; }
    .grid    { fill: none; stroke: #e4e4e0; stroke-width: 1; stroke-linejoin: round; }
    .area    { fill: #7952d4; fill-opacity: 0.13; stroke: #7952d4; stroke-width: 2; stroke-linejoin: round; }
    .knot    { fill: #7952d4; stroke: #fcfcfb; stroke-width: 1.5; }
    .name    { fill: #0b0b0b; font-size: 17px; font-weight: 600; }
    .fact    { fill: #52514e; font-size: 12.5px; }
    .note    { fill: #77756e; font-size: 11px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; stroke: #3a3a37; }
      .grid    { stroke: #3a3a37; }
      .area    { fill: #a78bfa; fill-opacity: 0.18; stroke: #a78bfa; }
      .knot    { fill: #a78bfa; stroke: #1a1a19; }
      .name    { fill: #ffffff; }
      .fact    { fill: #c3c2b7; }
      .note    { fill: #96958c; }
    }
  </style>
  <rect class="surface" x="0.5" y="0.5" width="699" height="307" rx="8" ry="8" stroke-width="1"/>

  <polygon class="grid" points="350,131.5 369.50,145.67 362.05,168.58 337.95,168.58 330.50,145.67"/>
  <polygon class="grid" points="350,111 388.99,139.33 374.10,185.17 325.90,185.17 311.01,139.33"/>
  <polygon class="grid" points="350,90.5 408.49,133.00 386.15,201.75 313.85,201.75 291.51,133.00"/>

  <line class="grid" x1="350" y1="152" x2="350"    y2="70"/>
  <line class="grid" x1="350" y1="152" x2="427.99" y2="126.66"/>
  <line class="grid" x1="350" y1="152" x2="398.20" y2="218.34"/>
  <line class="grid" x1="350" y1="152" x2="301.80" y2="218.34"/>
  <line class="grid" x1="350" y1="152" x2="272.01" y2="126.66"/>

  <polygon class="area" points="350,70 427.99,126.66 398.20,218.34 301.80,218.34 272.01,126.66"/>
  <circle class="knot" cx="350"    cy="70"     r="3.5"/>
  <circle class="knot" cx="427.99" cy="126.66" r="3.5"/>
  <circle class="knot" cx="398.20" cy="218.34" r="3.5"/>
  <circle class="knot" cx="301.80" cy="218.34" r="3.5"/>
  <circle class="knot" cx="272.01" cy="126.66" r="3.5"/>

  <text class="name" x="350" y="38" text-anchor="middle">Fast</text>
  <text class="fact" x="350" y="56" text-anchor="middle">Cranelift and V8 parity on Apple M4</text>

  <text class="name" x="446" y="118">Small</text>
  <text class="fact" x="446" y="136">337 KiB interpreter</text>
  <text class="fact" x="446" y="151">firmware, in 512 KB SRAM</text>

  <text class="name" x="416" y="212">Portable</text>
  <text class="fact" x="416" y="230">6 ISAs, x86_64 and</text>
  <text class="fact" x="416" y="245">ARM64 down to Thumb-2</text>

  <text class="name" x="284" y="212" text-anchor="end">On-device JIT</text>
  <text class="fact" x="284" y="230" text-anchor="end">verified and JIT-compiled</text>
  <text class="fact" x="284" y="245" text-anchor="end">on the chip itself</text>

  <text class="name" x="254" y="118" text-anchor="end">Full Wasm 3.0</text>
  <text class="fact" x="254" y="136" text-anchor="end">257/257 spec files —</text>
  <text class="fact" x="254" y="151" text-anchor="end">GC, EH, SIMD, tail calls</text>

  <text class="note" x="350" y="279" text-anchor="middle">strong on every axis a Wasm runtime is judged on — not just one</text>
</svg>
