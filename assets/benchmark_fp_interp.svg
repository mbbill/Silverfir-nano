<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 760 278" width="760" height="278">
  <title>Floating-Point Benchmarks — Interpreters</title>
  <style>
    text     { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .surface { fill: #fcfcfb; stroke: #d8d8d4; }
    .title   { fill: #0b0b0b; font-size: 17px; font-weight: 600; }
    .sub     { fill: #52514e; font-size: 11.5px; }
    .metric  { fill: #0b0b0b; font-size: 12.5px; font-weight: 600; }
    .unit    { fill: #77756e; font-size: 10.5px; }
    .note    { fill: #77756e; font-size: 10px; font-style: italic; }
    .name    { fill: #52514e; font-size: 11.5px; }
    .legend  { fill: #52514e; font-size: 11px; }
    .tier    { fill: #77756e; font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; }
    .val     { fill: #0b0b0b; font-size: 11.5px; font-weight: 600; }
    .rule    { stroke: #e4e4e0; stroke-width: 1; stroke-dasharray: 2 3; }
    .axis    { stroke: #d8d8d4; stroke-width: 1; }
    .s-sf { fill: #7952d4; }
    .s-cl { fill: #eb6834; }
    .s-v8 { fill: #1baf7a; }
    .s-wn { fill: #b02a8f; }
    .s-si { fill: #a855f7; }
    .s-w3 { fill: #eda100; }
    .s-wi { fill: #4a9ede; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; stroke: #3a3a37; }
      .title, .metric { fill: #ffffff; }
      .sub, .name, .legend { fill: #c3c2b7; }
      .val     { fill: #ffffff; }
      .unit, .note, .tier { fill: #96958c; }
      .rule    { stroke: #3a3a37; }
      .axis    { stroke: #3a3a37; }
      .s-sf { fill: #8b5cf6; }
      .s-cl { fill: #d95926; }
      .s-v8 { fill: #199e70; }
      .s-wn { fill: #c13a9d; }
      .s-si { fill: #9085e9; }
      .s-w3 { fill: #c98500; }
      .s-wi { fill: #3987e5; }
    }
  </style>
  <rect class="surface" width="760" height="278" rx="8" ry="8" stroke-width="1"/>
  <text class="title" x="380" y="30" text-anchor="middle">Floating-Point Benchmarks — Interpreters</text>
  <text class="sub" x="380" y="47" text-anchor="middle">Apple M4 · longer bar = better · each row scaled to its own best</text>
  <rect class="s-si" x="176.0" y="53" width="10" height="10" rx="2"/>
  <text class="legend" x="191.0" y="62">Silverfir (interp)</text>
  <rect class="s-w3" x="364.0" y="53" width="10" height="10" rx="2"/>
  <text class="legend" x="379.0" y="62">wasm3</text>
  <rect class="s-wi" x="552.0" y="53" width="10" height="10" rx="2"/>
  <text class="legend" x="567.0" y="62">wasmi 1.1.0</text>
  <line class="axis" x1="176" y1="76" x2="176" y2="268"/>

  <text class="metric" x="168" y="94" text-anchor="end">mandelbrot</text>
  <text class="unit" x="176" y="94">Kpixel/s</text>
  <text class="name" x="168" y="117" text-anchor="end">Silverfir (interp)</text>
  <rect class="s-si" x="176" y="104" width="452.0" height="18" rx="4"/>
  <text class="val" x="634.0" y="117">166.3</text>
  <text class="name" x="168" y="137" text-anchor="end">wasm3</text>
  <rect class="s-w3" x="176" y="124" width="364.2" height="18" rx="4"/>
  <text class="val" x="546.2" y="137">134</text>
  <text class="name" x="168" y="157" text-anchor="end">wasmi 1.1.0</text>
  <rect class="s-wi" x="176" y="144" width="156.5" height="18" rx="4"/>
  <text class="val" x="338.5" y="157">57.59</text>
  <text class="metric" x="168" y="190" text-anchor="end">c-ray</text>
  <text class="unit" x="176" y="190">Kpixel/s</text>
  <text class="name" x="168" y="213" text-anchor="end">Silverfir (interp)</text>
  <rect class="s-si" x="176" y="200" width="452.0" height="18" rx="4"/>
  <text class="val" x="634.0" y="213">1,413</text>
  <text class="name" x="168" y="233" text-anchor="end">wasm3</text>
  <rect class="s-w3" x="176" y="220" width="301.5" height="18" rx="4"/>
  <text class="val" x="483.5" y="233">942.4</text>
  <text class="name" x="168" y="253" text-anchor="end">wasmi 1.1.0</text>
  <rect class="s-wi" x="176" y="240" width="157.0" height="18" rx="4"/>
  <text class="val" x="339.0" y="253">490.8</text>
</svg>
