<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 760 362" width="760" height="362">
  <title>CoreMark — Apple M4</title>
  <style>
    text     { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .surface { fill: #fcfcfb; stroke: #d8d8d4; }
    .title   { fill: #0b0b0b; font-size: 17px; font-weight: 600; }
    .sub     { fill: #52514e; font-size: 11.5px; }
    .metric  { fill: #0b0b0b; font-size: 12.5px; font-weight: 600; }
    .unit    { fill: #77756e; font-size: 10.5px; }
    .note    { fill: #77756e; font-size: 10px; font-style: italic; }
    .name    { fill: #52514e; font-size: 11.5px; }
    .legend  { fill: #52514e; font-size: 11px; }
    .tier    { fill: #77756e; font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; }
    .val     { fill: #0b0b0b; font-size: 11.5px; font-weight: 600; }
    .rule    { stroke: #e4e4e0; stroke-width: 1; stroke-dasharray: 2 3; }
    .axis    { stroke: #d8d8d4; stroke-width: 1; }
    .s-sf { fill: #7952d4; }
    .s-cl { fill: #eb6834; }
    .s-v8 { fill: #1baf7a; }
    .s-wn { fill: #b02a8f; }
    .s-si { fill: #a855f7; }
    .s-w3 { fill: #eda100; }
    .s-wi { fill: #4a9ede; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; stroke: #3a3a37; }
      .title, .metric { fill: #ffffff; }
      .sub, .name, .legend { fill: #c3c2b7; }
      .val     { fill: #ffffff; }
      .unit, .note, .tier { fill: #96958c; }
      .rule    { stroke: #3a3a37; }
      .axis    { stroke: #3a3a37; }
      .s-sf { fill: #8b5cf6; }
      .s-cl { fill: #d95926; }
      .s-v8 { fill: #199e70; }
      .s-wn { fill: #c13a9d; }
      .s-si { fill: #9085e9; }
      .s-w3 { fill: #c98500; }
      .s-wi { fill: #3987e5; }
    }
  </style>
  <rect class="surface" width="760" height="362" rx="8" ry="8" stroke-width="1"/>
  <text class="title" x="380" y="30" text-anchor="middle">CoreMark — Apple M4</text>
  <text class="sub" x="380" y="47" text-anchor="middle">score · higher is better · seven runtimes on one shared scale</text>
  <line class="axis" x1="176" y1="66" x2="176" y2="350"/>
  <text class="tier" x="168" y="86" text-anchor="end">Optimizing compilers</text>
  <line class="rule" x1="176" y1="82" x2="740" y2="82"/>
  <text class="name" x="168" y="109.5" text-anchor="end">Silverfir (JIT)</text>
  <rect class="s-sf" x="176" y="94" width="443.0" height="22" rx="5"/>
  <text class="val" x="627.0" y="109.5">44,958</text>
  <text class="name" x="168" y="137.5" text-anchor="end">Cranelift 47.0.2</text>
  <rect class="s-cl" x="176" y="122" width="452.0" height="22" rx="5"/>
  <text class="val" x="636.0" y="137.5">45,874</text>
  <text class="name" x="168" y="165.5" text-anchor="end">V8 / Node 25.9</text>
  <rect class="s-v8" x="176" y="150" width="437.3" height="22" rx="5"/>
  <text class="val" x="621.3" y="165.5">44,378</text>
  <text class="tier" x="168" y="200" text-anchor="end">Baseline compiler</text>
  <line class="rule" x1="176" y1="196" x2="740" y2="196"/>
  <text class="name" x="168" y="223.5" text-anchor="end">Winch 47.0.2</text>
  <rect class="s-wn" x="176" y="208" width="210.6" height="22" rx="5"/>
  <text class="val" x="394.6" y="223.5">21,379</text>
  <text class="tier" x="168" y="258" text-anchor="end">Interpreters</text>
  <line class="rule" x1="176" y1="254" x2="740" y2="254"/>
  <text class="name" x="168" y="281.5" text-anchor="end">Silverfir (interp)</text>
  <rect class="s-si" x="176" y="266" width="80.7" height="22" rx="5"/>
  <text class="val" x="264.7" y="281.5">8,188</text>
  <text class="name" x="168" y="309.5" text-anchor="end">wasm3</text>
  <rect class="s-w3" x="176" y="294" width="46.8" height="22" rx="5"/>
  <text class="val" x="230.8" y="309.5">4,746</text>
  <text class="name" x="168" y="337.5" text-anchor="end">wasmi 2.0.0-beta.7</text>
  <rect class="s-wi" x="176" y="322" width="34.1" height="22" rx="5"/>
  <text class="val" x="218.1" y="337.5">3,456</text>
</svg>
