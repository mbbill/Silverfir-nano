[package]
name = "sf-nano-memprof-report"
version = "0.1.0"
edition = "2021"
authors = ["Bill Ming <mbbill@gmail.com>"]
description = "HTML report writer for Silverfir-nano memory profiles"
license = "MIT/Apache-2.0"

[lib]
name = "memprof_report"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracked_alloc = { package = "sf-nano-tracked-alloc", path = "../tracked-alloc", features = ["memprof"] }
