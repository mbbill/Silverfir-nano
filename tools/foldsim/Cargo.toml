[package]
name = "sf-nano-foldsim"
version = "0.1.0"
edition = "2021"
description = "Static analyzer: simulates the folded-stack-machine predecoder over wasm binaries and reports dispatch/operand statistics"
license = "MIT/Apache-2.0"
publish = false

[[bin]]
name = "foldsim"
path = "src/main.rs"

[dependencies]
wasmparser = { version = "0.246.2", default-features = false, features = ["std", "validate", "features", "simd"] }

[dev-dependencies]
wat = "1.246.2"
