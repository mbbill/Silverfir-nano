<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>sf-lens</title>
    <style>
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1e293b;
        overflow: hidden;
      }
      main {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      /* Scoped to the main tree SVG only — without this, the legend's
         inline SVGs (and the hidden defs-only SVG) would inherit
         width:100%/height:100% and balloon to fill their containers. */
      #tree {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
        user-select: none;
      }
      #tree:active {
        cursor: grabbing;
      }
      /* Arrows render subdued by default so dense diagrams stay readable;
         hover or selection brings them forward via the .highlighted class
         (see tree.ts for class-toggling). The widened contrast between
         default and highlighted makes "what am I currently examining"
         pop without losing the arrow set's structure. */
      #tree g.arrows path {
        opacity: 0.25;
        transition:
          opacity 80ms,
          stroke-width 80ms;
      }
      #tree g.arrows path.highlighted {
        opacity: 1;
        stroke-width: 1.5;
      }
      /* Canonical arrows are slate-500 grey by default (background context);
         when highlighted, restore the original blue so "the chain I'm
         examining" stands out by colour, not just intensity. The arrowhead
         picks up the same colour via marker fill="context-stroke". */
      #tree g.arrows path.canonical.highlighted {
        stroke: #3b82f6;
      }
      #tree text.field-row {
        cursor: pointer;
      }
      #tree text.field-row:hover {
        font-weight: 600;
      }
      /* Halo: paint a white stroke under every glyph so arrow lines passing
         behind text appear to break around the letters instead of slicing
         through them. paint-order puts stroke under fill so the visible
         color is still the fill. */
      #tree text {
        paint-order: stroke fill;
        stroke: white;
        stroke-width: 3px;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      #crate {
        position: fixed;
        top: 8px;
        right: 8px;
        z-index: 10;
        font-size: 12px;
        padding: 3px 6px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 4px;
      }
      /* Games-style keybinding hint, sits below the crate selector. */
      #keyhints {
        position: fixed;
        top: 36px;
        right: 8px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #475569;
        user-select: none;
      }
      #keyhints .row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 6px 2px 4px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 4px;
        opacity: 0.85;
        cursor: pointer;
      }
      #keyhints .row:hover {
        opacity: 1;
        border-color: #cbd5e1;
      }
      #keyhints .row.active {
        background: #fef3c7;
        border-color: #f59e0b;
        color: #78350f;
        opacity: 1;
      }
      #keyhints kbd {
        display: inline-block;
        min-width: 14px;
        padding: 1px 5px;
        font-family: inherit;
        font-size: 10px;
        font-weight: 600;
        text-align: center;
        color: #1e293b;
        background: #f1f5f9;
        border: 1px solid #cbd5e1;
        border-bottom-width: 2px;
        border-radius: 3px;
      }
      #keyhints .row.active kbd {
        background: #fde68a;
        border-color: #f59e0b;
        color: #78350f;
      }
      /* Arrow legend — same stroke / arrowhead / colors as the graph
         (see ensureArrowMarker in tree.ts). The marker referenced from
         the inline SVGs below uses fill=context-stroke so the arrowhead
         tracks each line's stroke color, matching the graph's behaviour. */
      #keyhints .legend {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-bottom: 6px;
        padding: 6px 8px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 4px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #keyhints .legend .legend-row {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #64748b;
        font-size: 10px;
      }
      #keyhints .legend .legend-arrow {
        display: block;
        flex-shrink: 0;
        width: 36px;
        height: 10px;
      }
      .error {
        position: absolute;
        inset: 0;
        padding: 16px;
        color: #b91c1c;
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        background: white;
      }
      /* Hover-popover for incoming ownership relationships. Frosted-glass
         backdrop so the arrows and labels behind read faintly through it. */
      .owners-panel {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        border: 1px solid #e2e8f0;
        border-radius: 6px;
        padding: 0 14px 8px 14px;
        font-size: 12px;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #1e293b;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.12);
        min-width: 200px;
        max-width: 360px;
        max-height: 420px;
        overflow-y: auto;
        /* Thin always-visible scrollbar so users see "more below" even
           on macOS where overflow-y:auto otherwise auto-hides the bar. */
        scrollbar-width: thin;
        scrollbar-color: rgba(100, 116, 139, 0.45) transparent;
      }
      .owners-panel::-webkit-scrollbar {
        width: 8px;
      }
      .owners-panel::-webkit-scrollbar-track {
        background: transparent;
      }
      .owners-panel::-webkit-scrollbar-thumb {
        background: rgba(100, 116, 139, 0.35);
        border-radius: 4px;
      }
      .owners-panel::-webkit-scrollbar-thumb:hover {
        background: rgba(100, 116, 139, 0.6);
      }
      .owners-panel .header {
        position: sticky;
        top: 0;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 0 -14px 6px -14px;
        padding: 8px 14px 4px 14px;
        border-bottom: 1px solid #f1f5f9;
      }
      .owners-panel .title {
        font-weight: 600;
        color: #475569;
        font-size: 11px;
        letter-spacing: 0.02em;
      }
      .owners-panel .pin-btn {
        background: transparent;
        border: none;
        font-size: 14px;
        cursor: pointer;
        padding: 0 2px;
        line-height: 1;
        opacity: 0.45;
        transition: opacity 80ms, color 80ms;
        color: #64748b;
      }
      .owners-panel .pin-btn:hover {
        opacity: 1;
      }
      .owners-panel .pin-btn.active {
        opacity: 1;
        color: #ef4444;
      }
      .owners-panel ul.owners-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .owners-panel li.owners-row {
        cursor: pointer;
        padding: 4px 6px;
        display: flex;
        flex-direction: column;
        border-radius: 3px;
        transition: background-color 80ms;
      }
      .owners-panel li.owners-row:hover {
        background: rgba(59, 130, 246, 0.08);
      }
      .owners-panel li.owners-row .module {
        color: #64748b;
        font-size: 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .owners-panel li.owners-row .types {
        color: #1e293b;
        font-size: 12px;
      }
      .owners-panel .more {
        color: #94a3b8;
        font-size: 10px;
        margin-top: 6px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <svg id="tree" role="img" aria-label="module and type tree"></svg>
      <div id="error" class="error" hidden></div>
    </main>
    <select id="crate" aria-label="crate"></select>
    <!-- Hidden SVG defs reachable from any inline SVG on the page —
         shared marker for the legend arrows. Same shape as the graph's
         markers; fill="context-stroke" makes the arrowhead track each
         line's stroke colour automatically. -->
    <svg width="0" height="0" aria-hidden="true" style="position: absolute" focusable="false">
      <defs>
        <!-- markerUnits="userSpaceOnUse" pins the arrowhead size to a
             constant 8×8 in user-space, regardless of the line's
             stroke-width. The "selected" legend entry therefore reads
             as "thicker line" without also turning into a bigger head. -->
        <marker
          id="legend-arrow-marker"
          viewBox="0 -4 8 8"
          refX="7"
          refY="0"
          markerUnits="userSpaceOnUse"
          markerWidth="8"
          markerHeight="8"
          orient="auto"
        >
          <path d="M0,-4L8,0L0,4Z" fill="context-stroke" />
        </marker>
      </defs>
    </svg>
    <div id="keyhints" aria-label="keybindings">
      <div class="legend" aria-label="arrow legend">
        <div class="legend-row">
          <svg class="legend-arrow" viewBox="0 0 36 10" preserveAspectRatio="xMidYMid meet">
            <line
              x1="2"
              y1="5"
              x2="28"
              y2="5"
              stroke="#94a3b8"
              stroke-width="1"
              marker-end="url(#legend-arrow-marker)"
            />
          </svg>
          <span>canonical</span>
        </div>
        <div class="legend-row">
          <svg class="legend-arrow" viewBox="0 0 36 10" preserveAspectRatio="xMidYMid meet">
            <line
              x1="2"
              y1="5"
              x2="28"
              y2="5"
              stroke="#3b82f6"
              stroke-width="1.5"
              marker-end="url(#legend-arrow-marker)"
            />
          </svg>
          <span>selected</span>
        </div>
        <div class="legend-row">
          <svg class="legend-arrow" viewBox="0 0 36 10" preserveAspectRatio="xMidYMid meet">
            <line
              x1="2"
              y1="5"
              x2="28"
              y2="5"
              stroke="#f59e0b"
              stroke-width="1"
              marker-end="url(#legend-arrow-marker)"
            />
          </svg>
          <span>drift_below</span>
        </div>
        <div class="legend-row">
          <svg class="legend-arrow" viewBox="0 0 36 10" preserveAspectRatio="xMidYMid meet">
            <line
              x1="2"
              y1="5"
              x2="28"
              y2="5"
              stroke="#ef4444"
              stroke-width="1"
              marker-end="url(#legend-arrow-marker)"
            />
          </svg>
          <span>drift_above</span>
        </div>
      </div>
      <div class="row" id="hint-focus"><kbd>F</kbd><span>focus</span></div>
      <div class="row" id="hint-scale" title="Reset zoom to 100%"><kbd>S</kbd><span>scale</span><span id="scale-value">100%</span></div>
      <div class="row" id="hint-reset" title="Reset everything"><kbd>R</kbd><span>reset</span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
