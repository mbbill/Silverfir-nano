[package]
name = "sf-nano-mandelbrot-wasm-kernel-i64"
version = "0.1.0"
edition = "2021"
publish = false
description = "Q16.16 Mandelbrot kernel compiled to wasm32-unknown-unknown. Used as input to sf-nano-core's JIT for Phase 3 (dump emitted Thumb-2) and Phase 4 (optimize i64 codegen)."

# Standalone crate: own Cargo.lock, not part of any workspace. Host
# deps (sf-nano-core, std) don't belong in a wasm32 build graph.
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false
