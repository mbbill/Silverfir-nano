[package]
name = "sf-nano-core"
version = "0.1.0"
edition = "2021"
authors = ["Bill Ming <mbbill@gmail.com>"]
description = "A minimal no_std WebAssembly 2.0 interpreter"
license = "MIT/Apache-2.0"
keywords = ["wasm", "webassembly", "interpreter", "no_std"]
categories = ["wasm", "no-std"]

[dependencies]
paste = "1.0"
tracked_alloc = { package = "sf-nano-tracked-alloc", path = "../tools/tracked-alloc" }
filetime = { version = "0.2", optional = true }

[dev-dependencies]
wat = "1.239"

[features]
default = ["jit", "guard-pages"]
jit = []
emulator = ["jit"]
wasi = ["dep:filetime"]
validator = []
call-trace = ["jit"]
guard-pages = ["jit"]
ir-dump = ["jit"]
jitdump = ["jit"]
memprof = ["tracked_alloc/memprof"]
# Force the arm32 backend to emit Thumb-2 (via enc_t2.rs) instead of A32
# (via enc_a32.rs). Intended for running the armv7-linux-musleabihf test
# harness against cortex-a15 to validate Thumb-2 encodings end-to-end; the
# resulting binary relies on ARM/Thumb interworking at the A32↔Thumb call
# boundary. Real M-profile targets select enc_t2.rs via sf_arch_thumbm
# instead, and don't need this feature.
thumb2-test = ["jit"]
