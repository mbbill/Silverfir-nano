[package]
name = "sf-nano-core"
version = "0.1.0"
edition = "2021"
authors = ["Bill Ming <mbbill@gmail.com>"]
description = "A minimal no_std WebAssembly 2.0 interpreter"
license = "MIT/Apache-2.0"
keywords = ["wasm", "webassembly", "interpreter", "no_std"]
categories = ["wasm", "no-std"]

[dependencies]
paste = "1.0"
tracked_alloc = { package = "sf-nano-tracked-alloc", path = "../tools/tracked-alloc" }
filetime = { version = "0.2", optional = true }

[dev-dependencies]
wat = "1.246.2"

[features]
# ---------------------------------------------------------------------------
# Execution engines. At least one is required -- `lib.rs` turns "neither" into
# a compile error rather than a crate that parses Wasm and cannot run it. The
# two are independent: neither implies the other, and both are on by default.
# ---------------------------------------------------------------------------

default = ["jit", "interp", "guard-pages"]

# The optimizing JIT: Wasm -> Semantic IR -> SSA-IR -> MachineIR -> native
# code, compiled on the target device.
jit = []

# The folded stack machine interpreter. Its dispatch
# handlers are generated per target at BUILD time and linked into `.text`, so
# it needs no executable memory and does not imply `jit`. A target with no
# generated engine still builds; instantiating an interpreter there fails with
# a clean error.
interp = []

# ---------------------------------------------------------------------------
# JIT options. Each implies `jit`, because none of them means anything without
# it -- asking for one is asking for the JIT.
# ---------------------------------------------------------------------------

# Reserve guard pages after linear memory so the JIT can elide bounds checks.
# Applies only where the OS and backend support it; build.rs decides.
guard-pages = ["jit"]

# Force the arm32 backend to emit Thumb-2 (via enc_t2.rs) instead of A32 (via
# enc_a32.rs). Intended for running the armv7-linux-musleabihf harness against
# cortex-a15 to validate Thumb-2 encodings end to end; the resulting binary
# relies on ARM/Thumb interworking at the A32<->Thumb call boundary. Real
# M-profile targets select enc_t2.rs via sf_backend_thumbm and do not need it.
thumb2-test = ["jit"]

# ---------------------------------------------------------------------------
# Host-facing subsystems. Engine-independent.
# ---------------------------------------------------------------------------

# In-tree WASI preview1 host layer.
wasi = ["dep:filetime"]

# The standalone Wasm validator, used by the spec-suite harness.
validator = []

# ---------------------------------------------------------------------------
# Diagnostics. All off by default: each costs either binary size or run time,
# and nothing in the engines depends on them.
# ---------------------------------------------------------------------------

# Compile the interpreter's dispatch counter into every handler. It costs one
# ALU instruction on 100% of dispatches (measured ~1% of cycles, and -3.7% of
# CoreMark once the larger handler set is counted too), and only --interp-stats
# reads it. Dispatch counts are deterministic, so taking them from a separate
# binary loses nothing.
interp-count = ["interp"]

# Per-call tracing through the JIT's runtime boundary.
call-trace = ["jit"]

# Compile the JIT observability exporters used by SF_NATIVE_DUMP_DIR and
# SF_JITDUMP. Both consume the same emitted-code debug regions, so they share
# one build-time boundary; the environment selects which output is produced.
# IR dumping remains auto-on in hosted debug builds.
jit-debug = ["jit"]

# Route every allocation through the tracked-alloc facade and report phases.
memprof = ["tracked_alloc/memprof"]

# Temporary CI-only instrumentation for decomposing eager interpreter startup.
# This is intentionally separate from `interp-count`: it uses hosted
# `std::time::Instant`, exposes no behavior to ordinary builds, and is never
# enabled by a runtime feature set.
startup-profile = ["interp"]

[[example]]
name = "invoke_export"
required-features = ["wasi"]

[[example]]
name = "startup_stage_profile"
required-features = ["startup-profile"]
